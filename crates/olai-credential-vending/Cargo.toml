[package]
name = "olai-credential-vending"
description = "Server-side minting of downscoped cloud storage credentials from registered principals"
version = "0.0.6"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true

[dependencies]
# workspace dependencies (in alphabetical order)
async-trait = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Each account's user delegation key is refreshed under its own async lock.
tokio = { workspace = true, features = ["sync"] }
# `neon-trusted-vending` only: garbage-collection failures are logged, not returned.
tracing = { workspace = true, optional = true }
# `neon-trusted-vending` only: the Neon API URL.
url = { workspace = true, optional = true }

# in-repo dependencies
olai-http = { path = "../olai-http", version = "0.0.12" }
olai-storage-credentials = { path = "../olai-storage-credentials", version = "0.0.4" }

[dev-dependencies]
# A stand-in Blob service for user delegation key fetches.
mockito = "1.4"
# Emulator tests only: exercise minted credentials through a real S3 client.
object_store = { version = "0.13", default-features = false, features = ["aws"] }
olai-test-emulators = { path = "../olai-test-emulators" }
# End-to-end emulator tests: credentials minted here, serialized as UC REST responses
# and used through the client crate's stores.
olai-storage-credentials = { path = "../olai-storage-credentials", version = "0.0.4", features = ["unity"] }
olai-vended-store = { path = "../olai-vended-store" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
url = { workspace = true }

[features]
default = []
# Trusted vending for Neon object storage (`neon::NeonTrustedMinter`). Neon has no STS
# and no prefix scoping, so a minted key reaches every bucket on the branch (and its
# descendants) at the granted access level until it expires: hosts must authorize
# callers for that before vending. An explicit opt-in, never in a default; see
# docs/credential-vending.md.
neon-trusted-vending = ["olai-http/neon", "dep:tracing", "dep:url"]
# Integration tests against containerized emulators (needs Docker). See
# `olai-test-emulators`.
emulator-it = []
# A test against real Google Cloud: Credential Access Boundaries, which no emulator
# enforces. Needs credentials and env vars; see `tests/gcs_minter_live.rs`.
gcp-live = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
