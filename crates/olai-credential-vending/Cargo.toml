[package]
name = "olai-credential-vending"
description = "Server-side minting of downscoped cloud storage credentials from registered principals"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true

[dependencies]
# workspace dependencies (in alphabetical order)
async-trait = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
# The cached user delegation key is refreshed under an async lock.
tokio = { workspace = true, features = ["sync"] }

# in-repo dependencies
olai-http = { path = "../olai-http", version = "0.0.8" }
olai-storage-credentials = { path = "../olai-storage-credentials", version = "0.0.1" }

[dev-dependencies]
# Emulator tests only: exercise minted credentials through a real S3 client.
object_store = { version = "0.13", default-features = false, features = ["aws"] }
olai-test-emulators = { path = "../olai-test-emulators" }
# End-to-end emulator tests: credentials minted here, serialized as UC REST responses
# and used through the client crate's stores.
olai-storage-credentials = { path = "../olai-storage-credentials", features = ["unity"] }
olai-vended-store = { path = "../olai-vended-store" }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
url = { workspace = true }

[features]
# Integration tests against containerized emulators (needs Docker). See
# `olai-test-emulators`.
emulator-it = []

[package.metadata.docs.rs]
all-features = true
