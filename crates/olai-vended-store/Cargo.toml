[package]
name = "olai-vended-store"
description = "object_store stores backed by vended, auto-refreshing cloud storage credentials"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true

[dependencies]
# workspace dependencies (in alphabetical order)
async-trait = { workspace = true }
bytes = { workspace = true }
# Default features keep `clock` (for `Utc::now`) and `wasmbind` (which makes `Utc::now`
# work on wasm32-unknown-unknown).
chrono = { workspace = true }
futures = { workspace = true }
# `Method`, for presigned URLs.
http = "1"
thiserror = { workspace = true }
url = { workspace = true }

# crates.io dependencies (in alphabetical order)
object_store = { version = "0.13", default-features = false }

# in-repo dependencies
olai-storage-credentials = { path = "../olai-storage-credentials", version = "0.0.1" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# S3 bucket region discovery and the protocol clients. Native only: olai-http does not
# build for wasm32.
olai-http = { path = "../olai-http", version = "0.0.8", optional = true }
percent-encoding = { version = "2.1", optional = true }
reqwest = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
# `Handle`, to spawn store I/O on a dedicated runtime.
tokio = { workspace = true, features = ["rt"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# object_store's `CredentialProvider` must return `Send` futures; on wasm32 the
# protocol clients' futures are not, so the provider wraps them (single-threaded, so
# this never panics).
send_wrapper = { version = "0.6", features = ["futures"] }
# object_store's cloud clients draw randomness through two getrandom majors (0.2 via
# ring, 0.4 via rand); on wasm32-unknown-unknown each needs its browser backend
# selected by feature. None of these are `use`d, hence the machete ignore below.
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
# object_store's GCS client signs with ring, whose RNG needs its JS backend on wasm32.
ring = { version = "0.17", features = ["wasm32_unknown_unknown_js"], optional = true }

[dev-dependencies]
mockito = "1.4"
# Emulator tests only: mint credentials from RustFS STS and Azurite.
olai-http = { path = "../olai-http", version = "0.0.8" }
olai-test-emulators = { path = "../olai-test-emulators" }
reqwest = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[features]
default = ["aws", "azure", "gcp", "fs"]
# Store backends, forwarded to object_store.
aws = ["object_store/aws", "dep:olai-http"]
azure = ["object_store/azure"]
gcp = ["object_store/gcp", "dep:ring"]
# `file://` locations (native only).
fs = ["object_store/fs"]
# Vending protocols (native only). Each brings its wire adapter from
# olai-storage-credentials and a hand-written client.
# Authentication to vending servers from string keys (see `auth`); enabled by every
# protocol.
auth = ["dep:olai-http"]
# The Databricks credential chain as an authentication option.
databricks = ["auth"]
# What every protocol client shares (the `api` module and the dispatcher). Enabled by
# the protocol features; not useful on its own.
protocol = [
  "auth",
  "dep:percent-encoding",
  "dep:reqwest",
  "dep:serde",
  "dep:serde_json",
]
unity = ["protocol", "olai-storage-credentials/unity"]
# The UC Delta API, for catalog-managed tables; extends `unity`.
delta-api = ["unity", "olai-storage-credentials/delta-api"]
# Iceberg REST catalogs.
iceberg = ["protocol", "olai-storage-credentials/iceberg"]

# Integration tests against containerized emulators (needs Docker). See
# `olai-test-emulators`.
emulator-it = []

[package.metadata.cargo-machete]
ignored = ["getrandom_02", "getrandom_04", "ring"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
