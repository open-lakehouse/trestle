# The docs' S3 environment (docs-factory envs/unitycatalog/compose.aws.yaml): UC on host :8080,
# S3 on host :9000, a locally built image, a fixed container name, the same-path data mount,
# and storage the docs pages register themselves. Inline secrets so it can be committed.
version = 3

[selection]
modules = ["unity-catalog", "rustfs", "postgres"]

[selection.knob_overrides.unity-catalog]
# The bucket the docs pages read and write.
bucket = "uc-docs"
image = "uc-docs-unitycatalog:0.7.0"
build = "image"
container_name = "unitycatalog"
extra_mounts = "${UC_DOCS_ROOT:-/tmp/uc-docs}:${UC_DOCS_ROOT:-/tmp/uc-docs}"
writable_mounts = "${UC_DOCS_ROOT:-/tmp/uc-docs}"
storage_bootstrap = "none"
master_role_arn = "arn:aws:iam::123456789012:role/uc-master"

# Named volume for postgres so `docker compose down -v` resets the database.
[selection.knob_overrides.postgres]
data = "volume"

# The docs stacks bind only the listeners readers use.
[selection.knob_overrides.envoy]
publish_admin = "false"

[selection.knob_overrides.rustfs]
generic_endpoint_env = "true"

[context]
env_name = "uc-docs"
gateway_host_port = 8080
dedicated_listener_ports = [9000]
local_secrets = "inline"
