# The secret server's configuration: which consumer may ask for which secret on which socket,
# and which launch variable holds each one. Names only; the values never reach this file.
version: 1
listeners:
  - socket: /run/trestle-sds/egress-gateway/sds.sock
    consumer: egress-gateway
    secrets:
      - name: tickets
        env: TICKETS_API_KEY
      - name: docs_search
        env: DOCS_API_KEY
      - name: catalog-tools
        env: CATALOG_TOOLS_KEY
