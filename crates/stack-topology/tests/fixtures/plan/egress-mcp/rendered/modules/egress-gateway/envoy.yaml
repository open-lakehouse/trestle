# Egress Envoy config, rendered from the planner's egress routes. One listener per route:
# `credential_injector` has no per-route configuration, so each credential needs its own
# filter chain. Credentials come from the secret server over SDS and are never written here.

# SDS over gRPC needs a node id and cluster.
node: { id: egress-gateway, cluster: egress-gateway }

static_resources:
  listeners:
    - name: tickets
      address:
        socket_address: { address: 0.0.0.0, port_value: 10001 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: AUTO
                stat_prefix: egress_route_tickets
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format_source:
                          inline_string: "tickets %REQ(:METHOD)% %REQ(:PATH)% -> %UPSTREAM_CLUSTER% %RESPONSE_CODE%\n"
                route_config:
                  name: tickets
                  virtual_hosts:
                    - name: tickets
                      domains: ["*"]
                      routes:
                        # Only the route's path (and what is under it) is forwarded, unchanged;
                        # anything else is a 404.
                        - match: { path_separated_prefix: "/mcp" }
                          route:
                            cluster: route_tickets
                            # The upstream sees its own host, not the gateway's.
                            auto_host_rewrite: true
                            # Model output and MCP sessions stream.
                            timeout: 0s
                http_filters:
                  # The caller's own credentials go before injection. A route's
                  # `request_headers_to_remove` would run in the router, after the injector,
                  # and remove the injected header too.
                  - name: envoy.filters.http.header_mutation
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutation
                      mutations:
                        request_mutations:
                          - remove: authorization
                          - remove: x-api-key
                  # Adds the route's credential: `overwrite` so no caller can put its own in its
                  # place, and never forwards a request without one (a missing secret is a 401).
                  - name: envoy.filters.http.credential_injector
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.credential_injector.v3.CredentialInjector
                      overwrite: true
                      allow_request_without_credential: false
                      credential:
                        name: envoy.http.injected_credentials.generic
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.http.injected_credentials.generic.v3.Generic
                          header: Authorization
                          header_value_prefix: "Bearer "
                          credential:
                            name: tickets
                            sds_config:
                              resource_api_version: V3
                              initial_fetch_timeout: 10s
                              api_config_source:
                                api_type: GRPC
                                transport_api_version: V3
                                grpc_services:
                                  - envoy_grpc: { cluster_name: secret_server }
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
    - name: docs_search
      address:
        socket_address: { address: 0.0.0.0, port_value: 10002 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: AUTO
                stat_prefix: egress_route_docs_search
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format_source:
                          inline_string: "docs_search %REQ(:METHOD)% %REQ(:PATH)% -> %UPSTREAM_CLUSTER% %RESPONSE_CODE%\n"
                route_config:
                  name: docs_search
                  virtual_hosts:
                    - name: docs_search
                      domains: ["*"]
                      routes:
                        # Only the route's path (and what is under it) is forwarded, unchanged;
                        # anything else is a 404.
                        - match: { path_separated_prefix: "/v1/mcp" }
                          route:
                            cluster: route_docs_search
                            # The upstream sees its own host, not the gateway's.
                            auto_host_rewrite: true
                            # Model output and MCP sessions stream.
                            timeout: 0s
                http_filters:
                  # The caller's own credentials go before injection. A route's
                  # `request_headers_to_remove` would run in the router, after the injector,
                  # and remove the injected header too.
                  - name: envoy.filters.http.header_mutation
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutation
                      mutations:
                        request_mutations:
                          - remove: authorization
                          - remove: x-api-key
                  # Adds the route's credential: `overwrite` so no caller can put its own in its
                  # place, and never forwards a request without one (a missing secret is a 401).
                  - name: envoy.filters.http.credential_injector
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.credential_injector.v3.CredentialInjector
                      overwrite: true
                      allow_request_without_credential: false
                      credential:
                        name: envoy.http.injected_credentials.generic
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.http.injected_credentials.generic.v3.Generic
                          header: "x-api-key"
                          credential:
                            name: docs_search
                            sds_config:
                              resource_api_version: V3
                              initial_fetch_timeout: 10s
                              api_config_source:
                                api_type: GRPC
                                transport_api_version: V3
                                grpc_services:
                                  - envoy_grpc: { cluster_name: secret_server }
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
    - name: catalog-tools
      address:
        socket_address: { address: 0.0.0.0, port_value: 10003 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: AUTO
                stat_prefix: egress_route_catalog_tools
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format_source:
                          inline_string: "catalog-tools %REQ(:METHOD)% %REQ(:PATH)% -> %UPSTREAM_CLUSTER% %RESPONSE_CODE%\n"
                route_config:
                  name: catalog-tools
                  virtual_hosts:
                    - name: catalog-tools
                      domains: ["*"]
                      routes:
                        # Only the route's path (and what is under it) is forwarded, unchanged;
                        # anything else is a 404.
                        - match: { prefix: "/" }
                          route:
                            cluster: route_catalog_tools
                            # The upstream sees its own host, not the gateway's.
                            auto_host_rewrite: true
                            # Model output and MCP sessions stream.
                            timeout: 0s
                http_filters:
                  # The caller's own credentials go before injection. A route's
                  # `request_headers_to_remove` would run in the router, after the injector,
                  # and remove the injected header too.
                  - name: envoy.filters.http.header_mutation
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutation
                      mutations:
                        request_mutations:
                          - remove: authorization
                          - remove: x-api-key
                  # Adds the route's credential: `overwrite` so no caller can put its own in its
                  # place, and never forwards a request without one (a missing secret is a 401).
                  - name: envoy.filters.http.credential_injector
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.credential_injector.v3.CredentialInjector
                      overwrite: true
                      allow_request_without_credential: false
                      credential:
                        name: envoy.http.injected_credentials.generic
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.http.injected_credentials.generic.v3.Generic
                          header: Authorization
                          header_value_prefix: "Bearer "
                          credential:
                            name: catalog-tools
                            sds_config:
                              resource_api_version: V3
                              initial_fetch_timeout: 10s
                              api_config_source:
                                api_type: GRPC
                                transport_api_version: V3
                                grpc_services:
                                  - envoy_grpc: { cluster_name: secret_server }
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    # The secret server, over the Unix socket on the volume only this container shares with it.
    - name: secret_server
      type: STATIC
      connect_timeout: 2s
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: secret_server
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    pipe: { path: /run/trestle-sds/sds.sock }
    # Outside the environment, over TLS: verified against the system trust store.
    - name: route_tickets
      type: LOGICAL_DNS
      dns_lookup_family: V4_PREFERRED
      connect_timeout: 5s
      load_assignment:
        cluster_name: route_tickets
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: tickets.example.com
                      port_value: 443
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: tickets.example.com
          common_tls_context:
            validation_context:
              trusted_ca: { filename: /etc/ssl/certs/ca-certificates.crt }
              match_typed_subject_alt_names:
                - san_type: DNS
                  matcher: { exact: "tickets.example.com" }
    # Outside the environment, over TLS: verified against the system trust store.
    - name: route_docs_search
      type: LOGICAL_DNS
      dns_lookup_family: V4_PREFERRED
      connect_timeout: 5s
      load_assignment:
        cluster_name: route_docs_search
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: docs.example.com
                      port_value: 8443
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: docs.example.com
          common_tls_context:
            validation_context:
              trusted_ca: { filename: /etc/ssl/certs/ca-certificates.crt }
              match_typed_subject_alt_names:
                - san_type: DNS
                  matcher: { exact: "docs.example.com" }
    # Outside the environment, over TLS: verified against the system trust store.
    - name: route_catalog_tools
      type: LOGICAL_DNS
      dns_lookup_family: V4_PREFERRED
      connect_timeout: 5s
      load_assignment:
        cluster_name: route_catalog_tools
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: tools.example.com
                      port_value: 443
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: tools.example.com
          common_tls_context:
            validation_context:
              trusted_ca: { filename: /etc/ssl/certs/ca-certificates.crt }
              match_typed_subject_alt_names:
                - san_type: DNS
                  matcher: { exact: "tools.example.com" }

# Admin binds the container's loopback and is never published: only the in-container health
# check reaches /ready, and nothing on the network reaches /config_dump or /quitquitquit.
admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }
