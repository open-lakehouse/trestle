# Two MCP routes through the egress gateway for Omnigent, plus one MCP route it doesn't consume:
# Omnigent's registry lists the two, and neither its files nor its environment name a secret.
version = 8

[selection]
modules = ["omnigent", "uc-mcp", "unity-catalog-rs"]

[selection.knob_overrides.omnigent]
upstream = "keys"

[[selection.egress.routes]]
name = "tickets"
upstream = "https://tickets.example.com"
path = "/mcp"
consumers = ["omnigent"]
credential = { kind = "bearer", secret = "TICKETS_API_KEY" }
mcp = { title = "Tickets", tools = ["search", "read_ticket"] }

[[selection.egress.routes]]
name = "docs_search"
upstream = "https://docs.example.com:8443"
path = "/v1/mcp"
consumers = ["omnigent"]
credential = { kind = "header", name = "x-api-key", secret = "DOCS_API_KEY" }
mcp = { title = "Docs search", tools = ["query"] }

[[selection.egress.routes]]
name = "catalog-tools"
upstream = "https://tools.example.com"
consumers = ["uc-mcp"]
credential = { kind = "bearer", secret = "CATALOG_TOOLS_KEY" }
mcp = { title = "Catalog tools", tools = ["list"] }
