# Every platform feature on: sign-in and policy enforced by the gateway, and traces from the
# gateway and the policy engine. mangrove's Unity Catalog can't ask OPA (it speaks olai-auth's
# authorize API), so its policy integration is incompatible; Omnigent takes identity from the
# gateway; OPA opts out of tracing.
version = 7

[selection]
modules = ["postgres", "rustfs", "unity-catalog-rs", "mlflow", "omnigent"]

[selection.platform]
identity = true
policy = "opa"
observability = true

[selection.integrations.opa]
observability = false

[context]
env_name = "platform"
