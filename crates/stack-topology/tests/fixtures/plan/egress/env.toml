# A function route and an upstream route through the egress gateway, for Omnigent. Planned
# without secrets, so the function's URL is left for a render with them.
version = 8

[selection]
modules = ["omnigent"]

[selection.knob_overrides.omnigent]
upstream = "keys"

[[selection.egress.routes]]
name = "workgraph-planner"
function = "workgraph"
path = "/mcp"
consumers = ["omnigent"]
credential = { kind = "bearer", secret = "WORKGRAPH_PLANNER_API_KEY" }
mcp = { title = "Work graph (planner)", tools = ["read", "submit"] }

[[selection.egress.routes]]
name = "search"
upstream = "https://api.search.example.com"
path = "/v1"
consumers = ["omnigent"]
credential = { kind = "header", name = "x-api-key", secret = "SEARCH_API_KEY" }
