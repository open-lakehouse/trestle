# Models from two clouds' AI gateways: MLflow's AI Gateway on the Neon AI Gateway (a token),
# Omnigent's host straight on a Databricks workspace's serving endpoints, and its sessions on
# that workspace's sandbox host (both native). The graph draws Neon and Databricks groups.
version = 7

[selection]
modules = ["envoy", "mlflow", "omnigent", "neon-storage"]

[selection.knob_overrides.mlflow]
upstream = "neon"

[selection.knob_overrides.omnigent]
upstream = "databricks"
sandbox_host = "databricks"

[context]
env_name = "ai-gateways"
