# A hosted object store: its node carries a model ref, and its credentials stay references.
version = 3

[selection]
modules = ["envoy", "aws-s3", "unity-catalog"]

[selection.hosted.aws-s3]
cloud = "aws"

[selection.hosted.aws-s3.connection]
kind = "s3"
region = "us-east-1"
bucket = "{name}"
access_key_id = "${AWS_ACCESS_KEY_ID}"
secret_access_key = "${AWS_SECRET_ACCESS_KEY}"
role_arn = "arn:aws:iam::123456789012:role/uc"

[context]
env_name = "hosted"
