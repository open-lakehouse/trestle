# A bare Unity Catalog with its backends and no gateway: metadata in Postgres, data in RustFS,
# and each service published on its own host port (UC at localhost:8080, RustFS at :9000).
version = 4

[selection]
modules = ["unity-catalog", "postgres", "rustfs"]

[selection.gateway]
enabled = false

[context]
env_name = "uc-direct"
