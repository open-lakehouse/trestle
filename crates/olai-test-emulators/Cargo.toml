[package]
name = "olai-test-emulators"
description = "Containerized cloud storage emulators for integration tests (not published)"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Test-only scaffolding: never published, so release-plz skips it.
publish = false

[dependencies]
# workspace dependencies (in alphabetical order)
base64 = { workspace = true }
reqwest = { workspace = true }

# crates.io dependencies (in alphabetical order)
# Self-signed TLS certificates for emulators that need HTTPS (Azurite with OAuth).
rcgen = "0.14"
testcontainers = { version = "0.28" }
