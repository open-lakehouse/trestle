[package]
name = "olai-key-service"
description = "A KMS-style key service: the olai.keys.v1 gRPC API to wrap and unwrap data keys under versioned keys a server holds, and an olai-store KeyProvider client for it"
version = "0.0.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true

[dependencies]
# workspace dependencies (in alphabetical order)
async-trait = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
# The `encryption` feature carries the `KeyProvider` trait the client implements.
olai-store = { path = "../olai-store", version = "0.0.9", optional = true, features = ["encryption"] }
prost = { workspace = true }
tokio = { workspace = true, optional = true, features = ["macros", "net", "rt", "sync", "time"] }
tracing = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }

# crates.io dependencies (in alphabetical order)
# The Unix-socket connector of the client.
hyper-util = { version = "0.1", optional = true, features = ["tokio"] }
# `codegen` alone builds the generated client and server stubs; `channel` is the client's
# transport.
tonic = { version = "0.14", default-features = false, features = ["codegen"] }
tonic-prost = "0.14"
tower = { version = "0.5", optional = true, features = ["util"] }

[dev-dependencies]
# Regenerates src/gen/ from proto/ in a test (`BLESS=1` to write), with no protoc needed.
protox = "0.9"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tonic-prost-build = { version = "0.14", default-features = false }

[features]
default = []
# `KeyServiceProvider`: an `olai_store::KeyProvider` that wraps and unwraps over a key
# server's Unix socket. Pulls in tonic's transport and olai-store only when enabled.
client = [
  "dep:async-trait",
  "dep:futures",
  "dep:hyper-util",
  "dep:olai-store",
  "dep:tokio",
  "dep:tower",
  "dep:tracing",
  "dep:zeroize",
  "tonic/channel",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }
