[package]
name = "olai-secret-server"
description = "A secret discovery service (SDS) server that hands generic secrets to Envoy and other consumers over per-consumer Unix sockets"
version = "0.0.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true

[[bin]]
name = "olai-secret-server"
path = "src/main.rs"

[dependencies]
# workspace dependencies (in alphabetical order)
futures = { workspace = true }
prost = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "sync", "fs"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
zeroize = { workspace = true }

# crates.io dependencies (in alphabetical order)
clap = { version = "4.5", features = ["derive", "env"] }
# The Envoy v3 protos with tonic 0.14 server and client stubs (SDS service, `Secret`,
# `DiscoveryRequest`/`DiscoveryResponse`).
envoy-types = "0.7"
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", default-features = false, features = ["server", "router", "codegen"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
hyper-util = { version = "0.1", features = ["tokio"] }
tempfile = "3.1"
tonic = { version = "0.14", default-features = false, features = ["channel"] }
tower = { version = "0.5", features = ["util"] }
# Docker test only (`emulator-it`).
reqwest = { workspace = true }
serde_json = { workspace = true }
testcontainers = { version = "0.28" }

[features]
default = []
# The Docker integration test against a pinned Envoy (needs Docker). See tests/envoy_it.rs.
emulator-it = []
