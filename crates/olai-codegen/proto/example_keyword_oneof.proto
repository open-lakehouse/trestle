syntax = "proto3";
package example.oneof.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

// A request oneof whose variant is a Rust keyword: the client builder's setter takes `r#ref`.
// Compiled into the committed `example_keyword_oneof.bin` (see `tests/generation_integration.rs`).
// Kept apart from `example_edge_cases.proto`, whose tests also generate Python bindings, which
// don't support a oneof on a request message yet.

service PointerService {
  rpc SetPointer(SetPointerRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/pointers/{name}"
      body: "*"
    };
  }
}

message SetPointerRequest {
  string name = 1;
  oneof target {
    string ref = 2;
    int64 seq = 3;
  }
}
