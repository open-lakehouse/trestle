syntax = "proto3";
package example.edge.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";

// Edge cases the main `example.bin` fixture doesn't reach. Compiled into the committed
// `example_edge_cases.bin` (see `tests/generation_integration.rs` for the protoc command).

// A resource whose name component is a Rust keyword (`type`): the extractors, accessors and
// `qualified_name()` must emit it as `r#type`.
message Kind {
  option (google.api.resource) = {
    type: "example.io/Kind"
    pattern: "kinds/{type}"
    plural: "kinds"
    singular: "kind"
    name_field: "type"
  };

  string type = 1;
  string comment = 2 [(google.api.field_behavior) = OPTIONAL];
  string kind_id = 3 [(google.api.field_behavior) = IDENTIFIER];
}

service KindService {
  rpc ListKinds(ListKindsRequest) returns (ListKindsResponse) {
    option (google.api.http) = {get: "/kinds"};
  }
  rpc GetKind(GetKindRequest) returns (Kind) {
    option (google.api.http) = {get: "/kinds/{type}"};
  }
  rpc DeleteKind(DeleteKindRequest) returns (DeleteKindResponse) {
    option (google.api.http) = {delete: "/kinds/{type}"};
  }
  // A resource-targeted existence check: the native scoped client returns its `bool`.
  rpc CheckKind(CheckKindRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      custom: {kind: "HEAD", path: "/kinds/{type}"}
    };
  }
}

message ListKindsRequest {
  // A keyword-named optional query param.
  optional string match = 1;
  int32 max_results = 2;
  string page_token = 3;
  // Python keywords as optional query params: Python callers pass them as `from_=` / `in_=`.
  optional string from = 4;
  optional string in = 5;
  // A JS reserved word as an option: the TS client binds it as `delete_` (#394).
  optional bool delete = 6;
}

message ListKindsResponse {
  repeated Kind kinds = 1;
  string next_page_token = 2;
}

message GetKindRequest {
  string type = 1;
}

message DeleteKindRequest {
  string type = 1;
}

message DeleteKindResponse {}

message CheckKindRequest {
  string type = 1;
}

// A resource-less service with keyword path params and a message with two oneofs.
service RouteService {
  rpc PutRoute(PutRouteRequest) returns (Route) {
    option (google.api.http) = {
      post: "/routes/{type}/{ref}"
      body: "route"
    };
  }
  rpc ListRoutes(ListRoutesRequest) returns (ListRoutesResponse) {
    option (google.api.http) = {get: "/routes"};
  }
}

message ListRoutesRequest {
  // A keyword-named required query param.
  string ref = 1 [(google.api.field_behavior) = REQUIRED];
  // A JS reserved word as a required param: the TS client takes `class_` (#394).
  string class = 2 [(google.api.field_behavior) = REQUIRED];
}

message ListRoutesResponse {
  repeated Route routes = 1;
}

message PutRouteRequest {
  string type = 1;
  string ref = 2;
  Route route = 3 [(google.api.field_behavior) = REQUIRED];
}

// Two oneofs, declared out of alphabetical order: the parsed fields must keep declaration order
// (`target`, then `source`), not hash order.
message Route {
  oneof target {
    string target_url = 1;
    int64 target_id = 2;
  }
  oneof source {
    string source_url = 3;
    int64 source_id = 4;
  }
  string note = 5;
}

// Path fields next to `body: "*"` fields named after a Rust keyword: the hybrid extractor binds and
// reads them as `r#type`, for one body field and for several.
service EventService {
  rpc PostTag(PostTagRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/sessions/{session_id}/tags"
      body: "*"
    };
  }
  rpc PostEvent(PostEventRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/sessions/{session_id}/events"
      body: "*"
    };
  }
  // Path keywords that can't be raw identifiers name their fields `super_` / `self_`.
  rpc GetScope(GetScopeRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {get: "/scopes/{super}"};
  }
  // A read verb with a body: the extractor reads the body (`FromRequest`), not just the parts.
  rpc FindEvents(FindEventsRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      get: "/sessions/{session_id}/events"
      body: "*"
    };
  }
}

message PostTagRequest {
  string session_id = 1;
  string type = 2;
}

message PostEventRequest {
  string session_id = 1;
  string type = 2;
  google.protobuf.Struct data = 3;
  // A oneof on a request (#395): Python takes one keyword argument per variant, and a message
  // variant is boxed by buffa.
  oneof payload {
    // A variant named after a Rust keyword.
    string ref = 4;
    int64 seq = 5;
    Route route = 6;
  }
}

message GetScopeRequest {
  string super = 1;
  optional string self = 2;
}

message FindEventsRequest {
  string session_id = 1;
  string match = 2;
}

// A child resource of `Kind` whose singular is a Rust keyword (`type`): the root accessor, the
// `Kind` client's child navigator and the Python and Node accessors all name a method after it.
message Variety {
  option (google.api.resource) = {
    type: "example.io/Variety"
    pattern: "kinds/{kind}/types/{type}"
    plural: "types"
    singular: "type"
    name_field: "full_name"
  };

  string full_name = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string kind_name = 2;
  string name = 3;
  string comment = 4 [(google.api.field_behavior) = OPTIONAL];
}

service VarietyService {
  rpc CreateType(CreateTypeRequest) returns (Variety) {
    option (google.api.http) = {
      post: "/types"
      body: "*"
    };
  }
  rpc GetType(GetTypeRequest) returns (Variety) {
    option (google.api.http) = {get: "/types/{full_name}"};
  }
  rpc ListTypes(ListTypesRequest) returns (ListTypesResponse) {
    option (google.api.http) = {get: "/types"};
  }
  rpc DeleteType(DeleteTypeRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/types/{full_name}"};
  }
}

message CreateTypeRequest {
  string name = 1 [(google.api.field_behavior) = REQUIRED];
  string kind_name = 2 [(google.api.field_behavior) = REQUIRED];
}

message GetTypeRequest {
  string full_name = 1;
}

message ListTypesRequest {
  string kind_name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {child_type: "example.io/Variety"}
  ];
  int32 max_results = 2;
  string page_token = 3;
}

message ListTypesResponse {
  repeated Variety types = 1;
  string next_page_token = 2;
}

message DeleteTypeRequest {
  string full_name = 1;
}

// A request oneof whose variant is a Rust keyword: the client builder's setter takes `r#ref`.
service PointerService {
  rpc SetPointer(SetPointerRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/pointers/{name}"
      body: "*"
    };
  }
}

message SetPointerRequest {
  string name = 1;
  oneof target {
    string ref = 2;
    int64 seq = 3;
  }
}
