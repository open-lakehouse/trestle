syntax = "proto3";
package demo.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";

enum Color {
  COLOR_UNSPECIFIED = 0;
  RED = 1;
  GREEN = 2;
}

message Widget {
  // A message-nested enum: buffa/prost nest it under a snake_case module named
  // after the parent message (`widget::Size`), so the PyO3 wrapper and the
  // node/builder enum references must resolve through that path, not the bare leaf
  // name. This is the case that drove the buffa nested-enum path fix.
  enum Size {
    SIZE_UNSPECIFIED = 0;
    SMALL = 1;
    LARGE = 2;
  }

  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  Color color = 2;
  Size size = 3;
}

message Circle {
  double radius = 1;
}

message Square {
  double side = 1;
}

// A message with a oneof (`shape`) flattening a message variant (`circle`),
// another message variant (`square`), and a scalar variant (`label`). The PyO3
// wrapper constructor must expose one optional kwarg per variant and set the
// oneof accordingly (issue #99); this exercises both the boxed-message and the
// scalar variant write/read paths against real buffa models.
message Shape {
  oneof shape {
    Circle circle = 1;
    Square square = 2;
    string label = 3;
  }
}

message ListWidgetsRequest {
  int32 max_results = 1;
  string page_token = 2;
  Color color = 3;
}

message ListWidgetsResponse {
  repeated Widget widgets = 1;
}

// `Shape` is a request input, so its PyO3 wrapper gets the keyword constructor
// (only the models that a request takes have one).
message CreateShapeRequest {
  Shape shape = 1;
}

service WidgetService {
  rpc ListWidgets(ListWidgetsRequest) returns (ListWidgetsResponse) {
    option (google.api.http) = { get: "/widgets" };
  }
  rpc CreateShape(CreateShapeRequest) returns (Shape) {
    option (google.api.http) = { post: "/shapes" body: "shape" };
  }
}

// A resource-annotated message. Its service gets the standard Get/List/Delete
// classification, so the bindings emit a resource-scoped `GadgetClient` (plus its
// `AsyncGadgetClient` twin) and a paginated list (`next_page_token`) that the
// Python bindings expose as a lazy pager.
message Gadget {
  option (google.api.resource) = {
    type: "demo.io/Gadget"
    pattern: "gadgets/{gadget}"
    plural: "gadgets"
    singular: "gadget"
  };

  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  Color color = 2;
}

message GetGadgetRequest {
  string name = 1;
}

// `optional` paging fields: the generated `into_stream` pagination treats
// `max_results` as an optional cap and `page_token` / `next_page_token` as an
// optional cursor.
message ListGadgetsRequest {
  optional int32 max_results = 1;
  optional string page_token = 2;
}

message ListGadgetsResponse {
  repeated Gadget gadgets = 1;
  optional string next_page_token = 2;
}

message DeleteGadgetRequest {
  string name = 1;
}

message DeleteGadgetResponse {}

service GadgetService {
  rpc GetGadget(GetGadgetRequest) returns (Gadget) {
    option (google.api.http) = { get: "/gadgets/{name}" };
  }
  rpc ListGadgets(ListGadgetsRequest) returns (ListGadgetsResponse) {
    option (google.api.http) = { get: "/gadgets" };
  }
  rpc DeleteGadget(DeleteGadgetRequest) returns (DeleteGadgetResponse) {
    option (google.api.http) = { delete: "/gadgets/{name}" };
  }
}
