[package]
name = "olai-stack-runtime"
description = "Run trestle environments on Docker Compose: a ComposeEngine over the Docker CLI, status, health and events"
version = "0.0.9"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true

[dependencies]
# local crates (release-plz keeps versions in sync) (in alphabetical order)
olai-stack-state = { path = "../stack-state", version = "0.0.8" }
olai-stack-topology = { path = "../stack-topology", version = "0.0.18", features = [
    "std-io",
    "catalog",
] }

# workspace dependencies (in alphabetical order)
async-trait = { workspace = true }
# Branch expiry timestamps, behind `neon`.
chrono = { workspace = true, optional = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "sync"] }

# crates.io dependencies (in alphabetical order)
# The OS credential store (macOS Keychain, Windows Credential Manager, the Linux kernel
# keyring), behind `keychain`. Native backends only: no D-Bus secret service.
keyring = { version = "3.6", default-features = false, features = [
    "apple-native",
    "windows-native",
    "linux-native",
], optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[features]
# `KeychainProvider`: secrets in the OS credential store.
keychain = ["dep:keyring"]
# `NeonControl`, `NeonCli` and `NeonBranchSource`: Neon branches as an environment source,
# through the Neon CLI (with `testing`, also `FakeNeon`).
neon = ["dep:chrono"]
# `FakeEngine`: an in-memory `ComposeEngine` for tests of code that drives one.
testing = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
