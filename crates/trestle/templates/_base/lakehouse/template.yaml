name: lakehouse
version: 0.1.0
display_name: "Lakehouse project"
summary: "Project skeleton for an open-lakehouse app; the composed dev environment is created separately with `trestle env`."
description: |
  The always-rendered base for `trestle new`. It lays down a minimal project
  skeleton (README, .gitignore, a justfile with the codegen/dev recipes) that
  apps layer onto.

  The composed Docker-Compose dev environment (Envoy gateway, storage, catalog,
  ML tracking, …) is no longer scaffolded here — it is created and rendered as a
  first-class step with `trestle env new`, which owns the whole compose surface
  (module selection, per-module config knobs, and an editable `env.toml`). This
  keeps a single way to produce a composed environment.
authors: [trestle]
trestle_min_version: 0.1.0

template_context:
  has_app: false
  app_service_name: ""
  app_port: 8080

post_init:
  - run: "git init -q && git add -A && git commit -q -m 'chore: scaffolded by trestle' || true"
    confirm: true
    description: "Initialise a fresh git repository"
