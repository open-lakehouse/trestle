[package]
name = "olai-storage-credentials"
description = "Canonical model, storage locations and wire adapters for vended cloud storage credentials"
version = "0.0.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true

[dependencies]
# workspace dependencies (in alphabetical order)
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }

# crates.io dependencies (in alphabetical order)
# No default features: the `clock` and `wasmbind` features are not needed, because this
# crate never reads the clock (callers pass `now`).
chrono = { version = "0.4.34", default-features = false, features = ["serde", "std"] }
# Only `path::Path` is used. Without default features object_store pulls in none of its
# cloud clients (tokio, reqwest, ring), so the crate stays wasm32-clean.
object_store = { version = "0.13", default-features = false }
percent-encoding = "2.1"

[dev-dependencies]
futures = { workspace = true }
# Emulator tests only: mint session credentials from RustFS STS and exercise them
# through a real S3 client.
object_store = { version = "0.13", default-features = false, features = ["aws"] }
olai-http = { path = "../olai-http", version = "0.0.10" }
olai-test-emulators = { path = "../olai-test-emulators" }
# A raw, hand-signed ListObjectsV2: object_store always lists with a trailing `/`, so it
# cannot probe the bare-prefix case.
reqwest = { workspace = true }
ring = { version = "0.17", default-features = false, features = ["std"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[features]
# Wire adapters, one per vending protocol (see `wire`). `olai-vended-store` forwards
# features of the same names.
unity = []
delta-api = []
iceberg = []
sharing = []
wire = ["unity", "delta-api", "iceberg", "sharing"]
# Integration tests against containerized emulators (needs Docker). See
# `olai-test-emulators`.
emulator-it = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
