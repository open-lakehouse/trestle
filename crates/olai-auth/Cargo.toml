[package]
name = "olai-auth"
description = "Authentication and authorization for axum services: EdDSA JWT verification, API keys, a Principal extractor and a Cedar Authorizer port"
version = "0.0.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true

[dependencies]
# workspace dependencies (in alphabetical order)
async-trait = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Only the async mutex that keeps key refreshes single-flight.
tokio = { workspace = true, features = ["sync"] }

# crates.io dependencies (in alphabetical order)
# No default features: the json, form, query and serve features are not needed, so the
# hosts decide what else of axum they link.
axum = { version = "0.8", default-features = false }
# Only the `cedar` feature's embedded `CedarAuthorizer`. The extensions policies use for
# request context: `ipaddr` (`source_ip`), `datetime` (`request_time`) and `decimal`.
# Needs Rust 1.89, newer than the rest of the crate.
cedar-policy = { version = "4.14", default-features = false, features = ["datetime", "decimal", "ipaddr"], optional = true }
# Verification only. The default `fast` and `zeroize` features are kept; `rand_core` is not
# needed because this crate never generates keys.
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "fast", "zeroize"] }
# Only the `http` feature's JWKS fetch and the `pdp-client` feature's `HttpAuthorizer`. rustls without the workspace's http2/json/stream
# extras, to keep the client small.
reqwest = { version = "0.13", default-features = false, features = ["rustls"], optional = true }
# API key digests and their constant-time comparison.
sha2 = { version = "0.10", default-features = false }
# Only the `postgres` feature's `PgApiKeyStore`, `PgGrantStore` and `authz` migrations.
# Runtime queries (no offline cache; `macros` only for the embedded `migrate!`), and no
# runtime or TLS features: the host's own sqlx brings those.
sqlx = { version = "0.8", default-features = false, features = ["postgres", "migrate", "macros"], optional = true }
subtle = { version = "2.6", default-features = false }
# Without the workspace's `log` bridge.
tracing = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
# An in-test policy decision point for `HttpAuthorizer`.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
mockito = "1.4"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "time"] }
tower = { version = "0.5", default-features = false, features = ["util"] }

[features]
# `HttpKeySource`: fetch a JWKS document over HTTPS. Hosts that receive the keys some other
# way (see `PushKeySource`) leave it off and link no HTTP client.
http = ["dep:reqwest"]
# `PgApiKeyStore` and `PgGrantStore`: API keys and grants from Postgres tables, through the
# host's `sqlx::PgPool`, and the `authz` migrations that create them (`migrate`).
postgres = ["dep:sqlx"]
# `HttpAuthorizer`: ask a remote policy decision point over HTTPS.
pdp-client = ["dep:reqwest"]
# `CedarAuthorizer`: evaluate Cedar policies in-process. Needs Rust 1.89.
cedar = ["dep:cedar-policy"]

[[test]]
name = "postgres"
required-features = ["postgres"]

[[test]]
name = "authz"
required-features = ["cedar", "pdp-client"]

[[test]]
name = "grants"
required-features = ["cedar"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
