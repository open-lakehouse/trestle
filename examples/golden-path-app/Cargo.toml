[workspace]
resolver = "2"
members = [
  "crates/common",
  "crates/server",
  "crates/client",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["your-org"]
repository = "https://github.com/your-org/golden-path-app"

[workspace.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
http = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
url = "2"
futures = "0.3"
# Path dependency on the sibling trestle checkout, pinned to this PR's olai-http/
# olai-http-wasm changes (send_unchecked, bearer providers, request signers) that
# have not shipped to crates.io yet. Revert to a published version once released —
# see `just regen`'s note and CONTRIBUTING.md on the crates.io proxy delay.
olai-http = { path = "../../crates/olai-http" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
buffa = "0.7"
buffa-types = "0.7"
async-trait = "0.1"
# ConnectRPC server runtime + the http-body trait its generated client refers to.
connectrpc = { version = "0.7", features = ["server", "axum"] }
http-body = "1"
# Browser client: the generated client compiles to wasm32 against this fetch-based
# transport, with wasm-bindgen glue (built by `just build-wasm`). Path dependency:
# see the `olai-http` note above.
olai-http-wasm = { path = "../../crates/olai-http-wasm" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"