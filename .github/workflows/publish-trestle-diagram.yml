name: Publish trestle-diagram

# Publish `@open-lakehouse/trestle-diagram` (node/trestle-diagram) to npmjs.com
# and GitHub Packages, and attach it to its GitHub Release. One job builds and
# packs the tarball; three jobs ship that same tarball, each with only the
# permissions it needs. The GitHub Release gets the tarball, its SHA-256, and a
# build-provenance attestation.
#
# Releases come from release-plz: the placeholder crate at node/Cargo.toml
# carries the package version, release-plz bumps it and tags
# `trestle-diagram-v<version>`, and release-plz.yml calls this workflow with
# that tag. The version is stamped into package.json at pack time. Publishing
# is idempotent: a version a registry already has is skipped, so re-runs are
# safe.
#
# No stored credentials:
# - npmjs.com: trusted publishing (OIDC, `id-token: write`) with a provenance
#   attestation. The trusted publisher only allows *staged* publishing: CI runs
#   `npm stage publish`, and the version goes live once a maintainer approves
#   it on npmjs.com (or with `npm stage approve`) with 2FA. npm checks the
#   *calling* workflow, so the trusted publisher is registered for
#   `release-plz.yml` with the `release` environment.
# - GitHub Packages: has no OIDC exchange, so it uses the job's own short-lived
#   GITHUB_TOKEN (`packages: write`).
# Packages are only ever published from CI, never from a developer machine.
#
# Manual runs are for a dry run, or for the one-time npm bootstrap: npm cannot
# attach a trusted publisher to a package that does not exist yet, and OIDC
# cannot create one. The bootstrap *stages* the first version with a token
# instead (`npm stage publish`, which can create a package), and a maintainer
# promotes it on npmjs.com with 2FA. So the token can't publish anything on
# its own:
#   1. Store an npm token that can stage to the @open-lakehouse scope as
#      NPM_TOKEN in the `release` environment.
#   2. From `main`: `gh workflow run publish-trestle-diagram.yml -f
#      tag=trestle-diagram-v0.1.0 -f npm_bootstrap=true -f dry_run=false`
#      (the default `dry_run=true` checks it first).
#   3. Approve the staged version on npmjs.com and delete the token. Shortly
#      before the next trestle-diagram release, register the trusted publisher
#      (workflow `release-plz.yml`, environment `release`, stage publish only).
#      npm expires one that hasn't published within 2 days.
# release-plz releases a package's first version as soon as it reaches `main`,
# so that release's npm job fails with a 404 until this is done.

on:
  workflow_call:
    inputs:
      tag:
        description: "The release-plz tag to publish (trestle-diagram-v<version>)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (trestle-diagram-v<version>); default: the selected ref"
        required: false
        type: string
      dry_run:
        description: "Pack and run the publish commands with `--dry-run` only (no upload)"
        required: false
        type: boolean
        default: true
      npm_bootstrap:
        description: "First npm release only: stage it with the NPM_TOKEN secret, to promote on npmjs.com"
        required: false
        type: boolean
        default: false

# Least privilege: nothing at the top level.
permissions: {}

concurrency:
  group: publish-trestle-diagram
  cancel-in-progress: false

env:
  PACKAGE: "@open-lakehouse/trestle-diagram"
  # workflow_call has no `dry_run` input; treat it as a real publish.
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

jobs:
  build:
    name: Build and pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
          no-cache: true
      # The placeholder crate's `version` (release-plz owns it) is the package
      # version.
      - name: Read the release version
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          if [ -z "$version" ]; then
            echo "::error::no version in node/Cargo.toml"
            exit 1
          fi
          if [ -n "$TAG" ] && [ "$TAG" != "trestle-diagram-v$version" ]; then
            echo "::error::tag $TAG does not match trestle-diagram version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build:diagram
      # `bun pm pack` rewrites the `workspace:` protocol in package.json, which
      # `npm publish` of the directory would leave in place.
      - name: Pack
        working-directory: node/trestle-diagram
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm pkg set version="$VERSION"
          bun pm pack --filename "$RUNNER_TEMP/trestle-diagram.tgz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trestle-diagram-tgz
          path: ${{ runner.temp }}/trestle-diagram.tgz
          if-no-files-found: error
          retention-days: 7

  npmjs:
    name: Publish to npmjs.com
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The trusted publisher on npmjs.com is bound to this environment.
    environment: release
    permissions:
      id-token: write # npm trusted publishing (OIDC) + provenance
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: trestle-diagram-tgz
          path: ${{ runner.temp }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      # `npm stage publish` needs npm >= 11.15.0, newer than Node 24 may bundle.
      - name: Install an npm that can stage
        # zizmor: ignore[adhoc-packages] — the npm CLI itself, pinned to an
        # exact release.
        run: npm install --global npm@11.21.0
      - name: Check the npm version
        env:
          NEEDS: "11.15.0"
        run: |
          npm_version="$(npm --version)"
          if [ "$(printf '%s\n' "$NEEDS" "$npm_version" | sort -V | head -n1)" != "$NEEDS" ]; then
            echo "::error::npm $npm_version is too old (needs >= $NEEDS)"
            exit 1
          fi
      # `npm view` only sees approved versions: a re-run before the staged
      # version is approved stages it again, which npm rejects. Approve the
      # pending version instead.
      - name: Skip a version that is already published
        id: published
        run: |
          if npm view "$PACKAGE@$VERSION" version >/dev/null 2>&1; then
            echo "$PACKAGE@$VERSION is already on npmjs.com; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Stage (dry-run)
        if: ${{ env.DRY_RUN == 'true' }}
        run: npm stage publish "$RUNNER_TEMP/trestle-diagram.tgz" --access public --dry-run
      # npm prefers the OIDC exchange and only falls back to NODE_AUTH_TOKEN
      # when it fails, which is the case before the trusted publisher exists.
      # Outside the bootstrap the token is empty, so only OIDC can stage.
      - name: Stage
        if: ${{ env.DRY_RUN != 'true' && !steps.published.outputs.skip }}
        env:
          BOOTSTRAP: ${{ inputs.npm_bootstrap }}
          # zizmor: ignore[use-trusted-publishing] — creating the package is the
          # one thing OIDC cannot do. The token only stages; a maintainer
          # promotes the version on npmjs.com with 2FA.
          NODE_AUTH_TOKEN: ${{ inputs.npm_bootstrap && secrets.NPM_TOKEN || '' }}
        run: |
          npm stage publish "$RUNNER_TEMP/trestle-diagram.tgz" --access public --provenance
          if [ "$BOOTSTRAP" = true ]; then
            echo "::notice::Staged $PACKAGE@$VERSION. Approve it on npmjs.com, then register the trusted publisher."
          else
            echo "::notice::Staged $PACKAGE@$VERSION. Approve it on npmjs.com (or \`npm stage approve\`) with 2FA to publish it."
          fi

  github-packages:
    name: Publish to GitHub Packages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: trestle-diagram-tgz
          path: ${{ runner.temp }}
      # Writes an .npmrc for the GitHub Packages registry that reads the token
      # from NODE_AUTH_TOKEN.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
          scope: "@open-lakehouse"
          package-manager-cache: false
      - name: Skip a version that is already published
        id: published
        run: |
          if npm view "$PACKAGE@$VERSION" version >/dev/null 2>&1; then
            echo "$PACKAGE@$VERSION is already on GitHub Packages; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish (dry-run)
        if: ${{ env.DRY_RUN == 'true' }}
        run: npm publish "$RUNNER_TEMP/trestle-diagram.tgz" --dry-run
      - name: Publish
        if: ${{ env.DRY_RUN != 'true' && !steps.published.outputs.skip }}
        # zizmor: ignore[use-trusted-publishing] — npm trusted publishing (OIDC)
        # exists only for registry.npmjs.org; GitHub Packages authenticates the
        # job's own ephemeral GITHUB_TOKEN, so no long-lived credential exists.
        run: npm publish "$RUNNER_TEMP/trestle-diagram.tgz"

  github-release:
    name: Attest and attach to the GitHub Release
    needs: build
    # Not a dry run (the workflow-level DRY_RUN isn't available to job `if`s).
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Signs in its own job, away from the build job's third-party install and
    # build code.
    environment: release
    permissions:
      contents: write # attach assets to the existing GitHub Release
      id-token: write # OIDC for build-provenance attestations
      attestations: write # write the attestation to the attestations store
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: trestle-diagram-tgz
          path: ${{ runner.temp }}
      # npm's own tarball name, plus a checksum next to it.
      - name: Name and checksum the tarball
        id: files
        working-directory: ${{ runner.temp }}
        run: |
          tgz="open-lakehouse-trestle-diagram-$VERSION.tgz"
          mv trestle-diagram.tgz "$tgz"
          sha256sum "$tgz" > "$tgz.sha256"
          echo "tgz=$RUNNER_TEMP/$tgz" >> "$GITHUB_OUTPUT"
          echo "sha256=$RUNNER_TEMP/$tgz.sha256" >> "$GITHUB_OUTPUT"
      # Key-free SLSA build provenance over the exact bytes both registries
      # receive. GitHub Packages can't carry npm provenance, so this is the
      # attestation for that copy. Verify with
      # `gh attestation verify <tgz> --repo <owner>/<repo>`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            ${{ steps.files.outputs.tgz }}
            ${{ steps.files.outputs.sha256 }}
      # release-plz created the release before calling this workflow. `--clobber`
      # makes re-runs replace the assets.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TGZ: ${{ steps.files.outputs.tgz }}
          SHA256: ${{ steps.files.outputs.sha256 }}
        run: |
          gh release upload "trestle-diagram-v$VERSION" "$TGZ" "$SHA256" \
            --clobber --repo "$GITHUB_REPOSITORY"
