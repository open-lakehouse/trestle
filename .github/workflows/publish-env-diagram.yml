name: Publish env-diagram

# Publish `@open-lakehouse/env-diagram` (node/env-diagram) to npmjs.com and
# GitHub Packages. One job builds and packs the tarball; two jobs publish that
# same tarball, each with only the permission its registry needs.
#
# No stored credentials:
# - npmjs.com: trusted publishing (OIDC, `id-token: write`), which also
#   attaches a provenance attestation.
# - GitHub Packages: has no OIDC exchange, so it uses the job's own short-lived
#   GITHUB_TOKEN (`packages: write`).
# Packages are only ever published from here, never from a developer machine.
#
# npm cannot attach a trusted publisher to a package that does not exist yet,
# so the very first npm publish needs a token, once. Store an npm token that
# can publish to the @open-lakehouse scope as NPM_TOKEN in the `release`
# environment and run this workflow manually with `npm_bootstrap`. Then
# register the trusted publisher on npmjs.com (workflow
# `publish-env-diagram.yml`, environment `release`) and delete the token.
#
# Release: bump `version` in node/env-diagram/package.json, merge, then push a
# matching tag (`env-diagram-v<version>`, e.g. `env-diagram-v0.1.0`). A manual
# run publishes the current version, or with `dry_run` only packs and checks it.

on:
  push:
    tags: ["env-diagram-v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and run `npm publish --dry-run` only (no upload)"
        required: false
        type: boolean
        default: true
      npm_bootstrap:
        description: "First npm publish only: authenticate with the NPM_TOKEN secret"
        required: false
        type: boolean
        default: false

# Least privilege: nothing at the top level.
permissions: {}

concurrency:
  group: publish-env-diagram
  cancel-in-progress: false

jobs:
  build:
    name: Build and pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
          no-cache: true
      - run: bun install --frozen-lockfile
      - name: Check the tag matches the package version
        if: ${{ github.event_name == 'push' }}
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./env-diagram/package.json").version')"
          if [ "$TAG" != "env-diagram-v$version" ]; then
            echo "::error::tag $TAG does not match env-diagram version $version"
            exit 1
          fi
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build:diagram
      # `bun pm pack` rewrites the `workspace:` protocol in package.json, which
      # `npm publish` of the directory would leave in place.
      - name: Pack
        working-directory: node/env-diagram
        run: bun pm pack --filename "$RUNNER_TEMP/env-diagram.tgz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: env-diagram-tgz
          path: ${{ runner.temp }}/env-diagram.tgz
          if-no-files-found: error
          retention-days: 7

  npmjs:
    name: Publish to npmjs.com
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The trusted publisher on npmjs.com is bound to this environment.
    environment: release
    permissions:
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: env-diagram-tgz
          path: ${{ runner.temp }}
      # Trusted publishing needs npm >= 11.5.1, which Node 24 bundles.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Check npm supports trusted publishing
        run: |
          npm_version="$(npm --version)"
          if [ "$(printf '%s\n' 11.5.1 "$npm_version" | sort -V | head -n1)" != 11.5.1 ]; then
            echo "::error::npm $npm_version is too old for trusted publishing (needs >= 11.5.1)"
            exit 1
          fi
      - name: Publish (dry-run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: npm publish "$RUNNER_TEMP/env-diagram.tgz" --access public --dry-run
      # npm prefers the OIDC exchange and only falls back to NODE_AUTH_TOKEN
      # when it fails, which is the case before the trusted publisher exists.
      - name: Publish (bootstrap)
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run && inputs.npm_bootstrap }}
        env:
          # zizmor: ignore[use-trusted-publishing] — creating the package is the
          # one publish OIDC cannot do; token auth is required here.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "$RUNNER_TEMP/env-diagram.tgz" --access public
      - name: Publish
        if: ${{ github.event_name == 'push' || (!inputs.dry_run && !inputs.npm_bootstrap) }}
        run: npm publish "$RUNNER_TEMP/env-diagram.tgz" --access public

  github-packages:
    name: Publish to GitHub Packages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: env-diagram-tgz
          path: ${{ runner.temp }}
      # Writes an .npmrc for the GitHub Packages registry that reads the token
      # from NODE_AUTH_TOKEN.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
          scope: "@open-lakehouse"
          package-manager-cache: false
      - name: Publish (dry-run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish "$RUNNER_TEMP/env-diagram.tgz" --dry-run
      - name: Publish
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # zizmor: ignore[use-trusted-publishing] — npm trusted publishing (OIDC)
        # exists only for registry.npmjs.org; GitHub Packages authenticates the
        # job's own ephemeral GITHUB_TOKEN, so no long-lived credential exists.
        run: npm publish "$RUNNER_TEMP/env-diagram.tgz"
