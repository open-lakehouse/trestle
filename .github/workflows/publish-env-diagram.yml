name: Publish env-diagram

# Publish `@open-lakehouse/env-diagram` (node/env-diagram) to GitHub Packages.
#
# Credential-free: the job authenticates with its own short-lived GITHUB_TOKEN
# (`packages: write`), so no npm token or PAT is stored anywhere. Packages are
# only ever published from here, never from a developer machine.
#
# Release: bump `version` in node/env-diagram/package.json, merge, then push a
# matching tag (`env-diagram-v<version>`, e.g. `env-diagram-v0.1.0`). A manual
# run publishes the current version, or with `dry_run` only packs and checks it.

on:
  push:
    tags: ["env-diagram-v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and run `npm publish --dry-run` only (no upload)"
        required: false
        type: boolean
        default: true

# Least privilege: nothing at the top level.
permissions: {}

concurrency:
  group: publish-env-diagram
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @open-lakehouse/env-diagram
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
          no-cache: true
      # Only for `npm publish`: writes an .npmrc for the GitHub Packages
      # registry that reads the token from NODE_AUTH_TOKEN.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
          scope: "@open-lakehouse"
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - name: Check the tag matches the package version
        if: ${{ github.event_name == 'push' }}
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./env-diagram/package.json").version')"
          if [ "$TAG" != "env-diagram-v$version" ]; then
            echo "::error::tag $TAG does not match env-diagram version $version"
            exit 1
          fi
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build:diagram
      # `bun pm pack` rewrites the `workspace:` protocol in package.json, which
      # `npm publish` of the directory would leave in place.
      - name: Pack
        working-directory: node/env-diagram
        run: bun pm pack --filename "$RUNNER_TEMP/env-diagram.tgz"
      - name: Publish (dry-run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish "$RUNNER_TEMP/env-diagram.tgz" --dry-run
      - name: Publish
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # zizmor: ignore[use-trusted-publishing] — npm trusted publishing (OIDC)
        # exists only for registry.npmjs.org; GitHub Packages authenticates the
        # job's own ephemeral GITHUB_TOKEN, so no long-lived credential exists.
        run: npm publish "$RUNNER_TEMP/env-diagram.tgz"
