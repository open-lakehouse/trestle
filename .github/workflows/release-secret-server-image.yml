name: Release secret server image

# Builds crates/secret-server/Dockerfile for linux/amd64 and linux/arm64 and pushes
# ghcr.io/open-lakehouse/trestle-secret-server:<version>, with a build-provenance
# attestation, for each `olai-secret-server-v*` release.
#
# How this runs (the same shape as release-binaries.yml):
#   Primary trigger is `workflow_call` from release-plz.yml, when release-plz releases a
#   new `olai-secret-server` version; the release tag is passed in directly.
#   `workflow_dispatch` is for manual rebuilds against an existing tag.
#
# Auth is GITHUB_TOKEN with `packages: write`; no PAT. The first push creates the
# package; it is linked to this repository through the image's
# org.opencontainers.image.source label, and starts private until a maintainer makes it
# public in the package settings (once).
#
# Each architecture builds natively on its own runner (no QEMU), pushes by digest, and
# the merge job joins the digests into one multi-arch tag. No build cache is used:
# release builds stay hermetic.

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build from (e.g. olai-secret-server-v0.0.1)."
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing olai-secret-server-v* tag to build and push."
        required: true
        type: string

# Least privilege: nothing at the top level.
permissions: {}

concurrency:
  group: release-secret-server-image-${{ inputs.tag }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/open-lakehouse/trestle-secret-server

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read # check out the tag
      packages: write # push the per-platform image by digest
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            os: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Build the exact commit the release tag points at, not the branch tip.
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # The checked-out tag (a path context), not the event's default git context.
          context: .
          file: crates/secret-server/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Push multi-arch tag
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      packages: write # push the manifest list and the attestation
      id-token: write # OIDC for build-provenance attestations
      attestations: write # write the attestation to the attestations store
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The tag is passed through `env` (never expanded into the script) and must be
      # exactly `olai-secret-server-v<semver>`.
      - name: Create the multi-arch tag
        id: push
        env:
          TAG: ${{ inputs.tag }}
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          version="${TAG#olai-secret-server-v}"
          if [ "$version" = "$TAG" ] || ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::not an olai-secret-server release tag: $TAG"
            exit 1
          fi
          sources=()
          for digest in *; do
            sources+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create -t "$IMAGE:$version" "${sources[@]}"
          digest="$(docker buildx imagetools inspect "$IMAGE:$version" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "Pushed $IMAGE:$version ($digest)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # Key-free SLSA build provenance for the multi-arch image, verifiable with
      # `gh attestation verify oci://ghcr.io/open-lakehouse/trestle-secret-server:<version> --repo <owner>/<repo>`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
