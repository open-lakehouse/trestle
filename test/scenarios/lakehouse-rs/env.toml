version = 5

# The lakehouse scenario on mangrove's Rust Unity Catalog server (`unity-catalog-rs`) instead of
# the OSS one. MLflow serves its model registry from it all the same: both serve the
# `unity-catalog` API. Its key-encryption key comes from `UC_SERVER_KEK` in the environment that
# starts the stack, and is absent from every rendered file.

[selection]
modules = ["postgres", "rustfs", "unity-catalog-rs", "mlflow"]

[context]
env_name = "lakehouse-rs"
