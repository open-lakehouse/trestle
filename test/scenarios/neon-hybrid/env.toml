version = 6

# A hybrid environment on a Neon branch: MLflow and Omnigent run locally, on the branch's
# Postgres (`hosted-postgres`, vendor `neon`) and object storage (`neon-storage`), while Unity
# Catalog (mangrove's server, `unity-catalog-rs`) and Headwaters run as Neon Functions on the same branch. Binding the branch supplies
# every `${VAR}` (`trestle up --neon-branch`); `secrets.env` beside this file stands in for it.

[selection]
modules = ["mlflow", "omnigent", "unity-catalog-rs", "headwaters", "hosted-postgres", "neon-storage"]

[selection.hosted.hosted-postgres]
vendor = "neon"

[selection.hosted.hosted-postgres.connection]
kind = "postgres"
host = "${PGHOST}"
username = "${PGUSER}"
password = "${PGPASSWORD}"

[selection.hosted.unity-catalog-rs]
vendor = "neon-function"
connection = { kind = "function" }

[selection.hosted.headwaters]
vendor = "neon-function"
connection = { kind = "function" }

[context]
env_name = "neon-hybrid"
