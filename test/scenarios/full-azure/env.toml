version = 2

[selection]
modules = [
    "postgres",
    "azurite",
    "unity-catalog",
    "mlflow",
    "jaeger",
    "headwaters",
]
capabilities = []
extra_resources = []

[selection.gateway]
auth = false
policy = false

[context]
env_name = "full-azure"
gateway_service = "envoy"
gateway_internal_port = 10000
gateway_host_port = 9080
gateway_admin_port = 9901
dedicated_listener_ports = []
dedicated_listener_port_base = 9100
data_root = "./.data"

[context.provider_preference]
object_store = ["azurite"]
