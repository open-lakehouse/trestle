# Envoy front-edge config, rendered from the planner's gateway config.
# Route ordering matters: more-specific prefixes come before less-specific ones,
# and the default app route (if any) is emitted last.

static_resources:
  listeners:
    - name: gateway
      address:
        socket_address: { address: 0.0.0.0, port_value: 10000 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: AUTO
                stat_prefix: ingress_http
                use_remote_address: true
                # One line per request, `<host> <method> <path> -> <cluster> <status>`: the
                # quickest way to see where a request went. Anchored here (Envoy rejects
                # unknown top-level keys) and reused by every other listener.
                access_log: &access_log
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format_source:
                          inline_string: "%REQ(:AUTHORITY)% %REQ(:METHOD)% %REQ(X-ENVOY-ORIGINAL-PATH?:PATH)% -> %UPSTREAM_CLUSTER% %RESPONSE_CODE%\n"
                upgrade_configs:
                  - upgrade_type: websocket
                route_config:
                  name: gateway_route
                  virtual_hosts:
                    - name: all
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/api/2.1/unity-catalog" }
                          route:
                            cluster: unitycatalog
                        - match: { prefix: "/api/2.0/mlflow" }
                          route:
                            cluster: mlflow
                            regex_rewrite:
                              pattern:
                                google_re2: {}
                                regex: "^/api/2.0/mlflow(.*)$"
                              substitution: "/mlflow/api/2.0/mlflow\\1"
                        - match: { prefix: "/unity-catalog" }
                          route:
                            cluster: unitycatalog
                        - match: { prefix: "/api/2.0/otel" }
                          route:
                            cluster: mlflow
                        - match: { prefix: "/mlflow" }
                          route:
                            cluster: mlflow
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
    - name: dedicated_9100
      address:
        socket_address: { address: 0.0.0.0, port_value: 9100 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: AUTO
                stat_prefix: ingress_http
                use_remote_address: true
                access_log: *access_log
                upgrade_configs:
                  - upgrade_type: websocket
                route_config:
                  name: dedicated_9100_route
                  virtual_hosts:
                    - name: all
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route:
                            cluster: rustfs
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
    # Emulated public hostnames, in-network only: the gateway holds each as a compose network
    # alias and terminates TLS with a locally minted CA. Host headers pass through unchanged
    # (they are part of a SigV4 signature).
    - name: emulated_tls
      address:
        socket_address: { address: 0.0.0.0, port_value: 443 }
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                tls_certificates:
                  - certificate_chain: { filename: /certs/leaf.pem }
                    private_key: { filename: /certs/leaf-key.pem }
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: emulated_tls
                access_log: *access_log
                route_config:
                  name: emulated_tls_route
                  virtual_hosts:
                    - name: sts-shim
                      domains:
                        - "sts.amazonaws.com"
                        - "sts.amazonaws.com:443"
                        - "sts.us-east-1.amazonaws.com"
                        - "sts.us-east-1.amazonaws.com:443"
                      routes:
                        - match: { prefix: "/" }
                          # No timeout: object uploads and downloads can be long-lived.
                          route: { cluster: sts-shim, timeout: 0s }
                    - name: rustfs
                      domains:
                        - "s3.amazonaws.com"
                        - "s3.amazonaws.com:443"
                        - "s3.us-east-1.amazonaws.com"
                        - "s3.us-east-1.amazonaws.com:443"
                        - "unity.s3.amazonaws.com"
                        - "unity.s3.amazonaws.com:443"
                        - "mlflow.s3.amazonaws.com"
                        - "mlflow.s3.amazonaws.com:443"
                        - "unity.s3.us-east-1.amazonaws.com"
                        - "unity.s3.us-east-1.amazonaws.com:443"
                        - "mlflow.s3.us-east-1.amazonaws.com"
                        - "mlflow.s3.us-east-1.amazonaws.com:443"
                      routes:
                        - match: { prefix: "/" }
                          # No timeout: object uploads and downloads can be long-lived.
                          route: { cluster: rustfs, timeout: 0s }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: mlflow
      type: STRICT_DNS
      connect_timeout: 2s
      load_assignment:
        cluster_name: mlflow
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: mlflow
                      port_value: 5000
    - name: rustfs
      type: STRICT_DNS
      connect_timeout: 2s
      load_assignment:
        cluster_name: rustfs
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: rustfs
                      port_value: 9000
    - name: sts-shim
      type: STRICT_DNS
      connect_timeout: 2s
      load_assignment:
        cluster_name: sts-shim
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: sts-shim
                      port_value: 8080
    - name: unitycatalog
      type: STRICT_DNS
      connect_timeout: 2s
      load_assignment:
        cluster_name: unitycatalog
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: unitycatalog
                      port_value: 8080

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }