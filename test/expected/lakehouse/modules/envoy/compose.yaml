# Envoy gateway
services:
  envoy:
    image: envoyproxy/envoy:v1.40-latest
    restart: unless-stopped
    configs:
      - source: envoy_config
        target: /etc/envoy/envoy.yaml
    command: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "warn"]
    healthcheck:
      # Envoy's admin `/ready` answers 200 once every listener and cluster has initialized.
      # The image has bash but no curl, so the probe speaks HTTP over `/dev/tcp` itself.
      test:
        - "CMD"
        - "bash"
        - "-c"
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9901
          && printf 'GET /ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          && head -n1 <&3 | grep -q ' 200 '
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    depends_on:
      gateway-certs:
        condition: service_completed_successfully
    ports:
      - "9080:10000"
      - "9100:9100"
      - "9901:9901"
    volumes:
      - gateway-certs:/certs:ro
    networks:
      default:
        # In-network clients resolve these hostnames to the gateway: emulated public hosts,
        # whose TLS it terminates with a local CA, and under forward-auth the dotted alias
        # in-network callers address the shared listener by. Compose DNS has no wildcards:
        # each host is listed.
        aliases:
          - mlflow.s3.amazonaws.com
          - mlflow.s3.us-east-1.amazonaws.com
          - s3.amazonaws.com
          - s3.us-east-1.amazonaws.com
          - sts.amazonaws.com
          - sts.us-east-1.amazonaws.com
          - unity.s3.amazonaws.com
          - unity.s3.us-east-1.amazonaws.com

  # One-shot: mints the local CA and the gateway's certificate for its TLS hostnames.
  gateway-certs:
    image: eclipse-temurin:25-jdk-noble
    entrypoint: ["bash", "/certs.sh"]
    environment:
      CERT_DIR: /certs
      CERT_HOSTS: "mlflow.s3.amazonaws.com mlflow.s3.us-east-1.amazonaws.com s3.amazonaws.com s3.us-east-1.amazonaws.com sts.amazonaws.com sts.us-east-1.amazonaws.com unity.s3.amazonaws.com unity.s3.us-east-1.amazonaws.com"
    configs:
      - source: gateway_certs_script
        target: /certs.sh
    volumes:
      - gateway-certs:/certs

volumes:
  gateway-certs:
