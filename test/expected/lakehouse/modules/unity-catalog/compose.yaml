# Unity Catalog
services:
  unitycatalog:
    image: unitycatalog/unitycatalog:main-2f2e32d
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://<redacted>@db:5432/unitycatalog
      S3_ENDPOINT: http://envoy:9100
      AWS_ACCESS_KEY_ID: seaweedfs
      AWS_SECRET_ACCESS_KEY: seaweedfs
      AWS_REGION: us-east-1
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/2.1/unity-catalog/catalogs || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s