# Top-level compose entrypoint. Every backing service is pulled in via `include:`.
# The file list is owned by the planner, not edited by hand.
name: lakehouse

configs:
  envoy_config:
    file: ./modules/envoy/envoy.yaml
  gateway_certs_script:
    file: ./modules/envoy/certs.sh
  mlflow_seed_gateway:
    file: ./modules/mlflow/seed_gateway.py
  mlflow_uc_registry_entry_points:
    file: ./modules/mlflow/uc-registry/entry_points.txt
  mlflow_uc_registry_metadata:
    file: ./modules/mlflow/uc-registry/METADATA
  mlflow_uc_registry_module:
    file: ./modules/mlflow/uc-registry/trestle_mlflow_uc_registry.py
  postgres_init:
    file: ./modules/postgres/init-databases.sh
  rustfs_sts_shim:
    file: ./modules/rustfs/sts_shim.py
  unitycatalog_bootstrap_storage:
    file: ./modules/unity-catalog/bootstrap_storage.py
  unitycatalog_storage:
    file: ./modules/unity-catalog/storage.txt

secrets:
  postgres_password:
    file: ./modules/postgres/secrets/postgres_password
  unitycatalog_hibernate_properties:
    file: ./modules/unity-catalog/secrets/hibernate.properties
  unitycatalog_server_properties:
    file: ./modules/unity-catalog/secrets/server.properties

include:
  - path: ./modules/envoy/compose.yaml
    project_directory: .
  - path: ./modules/postgres/compose.yaml
    project_directory: .
  - path: ./modules/rustfs/compose.yaml
    project_directory: .
  - path: ./modules/unity-catalog/compose.yaml
    project_directory: .
  - path: ./modules/mlflow/compose.yaml
    project_directory: .
