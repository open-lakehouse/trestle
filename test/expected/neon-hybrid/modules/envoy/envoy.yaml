# Envoy front-edge config, rendered from the planner's gateway config.
# Route ordering matters: more-specific prefixes come before less-specific ones,
# and the default app route (if any) is emitted last.

static_resources:
  listeners:
    - name: gateway
      address:
        socket_address: { address: 0.0.0.0, port_value: 10000 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: AUTO
                stat_prefix: ingress_http
                use_remote_address: true
                # One line per request, `<host> <method> <path> -> <cluster> <status>`: the
                # quickest way to see where a request went. Anchored here (Envoy rejects
                # unknown top-level keys) and reused by every other listener.
                access_log: &access_log
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format_source:
                          inline_string: "%REQ(:AUTHORITY)% %REQ(:METHOD)% %REQ(X-ENVOY-ORIGINAL-PATH?:PATH)% -> %UPSTREAM_CLUSTER% %RESPONSE_CODE%\n"
                upgrade_configs:
                  - upgrade_type: websocket
                route_config:
                  name: gateway_route
                  virtual_hosts:
                    - name: all
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/api/2.1/unity-catalog" }
                          route:
                            cluster: unitycatalog
                            # An upstream outside the stack routes on its own host name.
                            auto_host_rewrite: true
                        - match: { prefix: "/api/2.0/mlflow" }
                          route:
                            cluster: mlflow
                            regex_rewrite:
                              pattern:
                                google_re2: {}
                                regex: "^/api/2\\x{2E}0/mlflow(.*)$"
                              substitution: "/mlflow/api/2.0/mlflow\\1"
                        - match: { prefix: "/api/3.0/mlflow" }
                          route:
                            cluster: mlflow
                            regex_rewrite:
                              pattern:
                                google_re2: {}
                                regex: "^/api/3\\x{2E}0/mlflow(.*)$"
                              substitution: "/mlflow/api/3.0/mlflow\\1"
                        - match: { prefix: "/api/4.0/mlflow" }
                          route:
                            cluster: mlflow
                            regex_rewrite:
                              pattern:
                                google_re2: {}
                                regex: "^/api/4\\x{2E}0/mlflow(.*)$"
                              substitution: "/mlflow/api/4.0/mlflow\\1"
                        - match: { prefix: "/api/v1/lineage" }
                          route:
                            cluster: headwaters
                            # An upstream outside the stack routes on its own host name.
                            auto_host_rewrite: true
                        - match: { prefix: "/api/2.0/otel" }
                          route:
                            cluster: mlflow
                            regex_rewrite:
                              pattern:
                                google_re2: {}
                                regex: "^/api/2\\x{2E}0/otel(.*)$"
                              substitution: "/mlflow\\1"
                        - match: { prefix: "/ai-gateway" }
                          route:
                            cluster: mlflow
                            # No timeout: the upstream holds requests open (SSE, streamed output).
                            timeout: 0s
                            regex_rewrite:
                              pattern:
                                google_re2: {}
                                regex: "^/ai-gateway(.*)$"
                              substitution: "/mlflow/gateway\\1"
                          # The upstream authenticates with credentials it holds itself: drop the
                          # caller's at forward time (after any auth check) so they can't shadow them.
                          request_headers_to_remove: ["authorization", "x-api-key"]
                        - match: { prefix: "/omnigent" }
                          route:
                            cluster: omnigent
                            # No timeout: the upstream holds requests open (SSE, streamed output).
                            timeout: 0s
                        - match: { prefix: "/lineage" }
                          route:
                            cluster: headwaters
                            # An upstream outside the stack routes on its own host name.
                            auto_host_rewrite: true
                            regex_rewrite:
                              pattern:
                                google_re2: {}
                                regex: "^/lineage/?(.*)$"
                              substitution: "/\\1"
                        - match: { prefix: "/mlflow" }
                          route:
                            cluster: mlflow
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: headwaters
      # Outside the stack, over TLS: verified against the system trust store.
      type: LOGICAL_DNS
      dns_lookup_family: V4_PREFERRED
      connect_timeout: 5s
      load_assignment:
        cluster_name: headwaters
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: br-example-123456-headwaters.compute.eu-central-1.aws.neon.tech
                      port_value: 443
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: br-example-123456-headwaters.compute.eu-central-1.aws.neon.tech
          common_tls_context:
            validation_context:
              trusted_ca: { filename: /etc/ssl/certs/ca-certificates.crt }
              match_typed_subject_alt_names:
                - san_type: DNS
                  matcher: { exact: "br-example-123456-headwaters.compute.eu-central-1.aws.neon.tech" }
    - name: mlflow
      type: STRICT_DNS
      connect_timeout: 2s
      load_assignment:
        cluster_name: mlflow
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: mlflow
                      port_value: 5000
    - name: omnigent
      type: STRICT_DNS
      connect_timeout: 2s
      load_assignment:
        cluster_name: omnigent
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: omnigent
                      port_value: 8000
    - name: unitycatalog
      # Outside the stack, over TLS: verified against the system trust store.
      type: LOGICAL_DNS
      dns_lookup_family: V4_PREFERRED
      connect_timeout: 5s
      load_assignment:
        cluster_name: unitycatalog
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: br-example-123456-unitycatalog.compute.eu-central-1.aws.neon.tech
                      port_value: 443
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: br-example-123456-unitycatalog.compute.eu-central-1.aws.neon.tech
          common_tls_context:
            validation_context:
              trusted_ca: { filename: /etc/ssl/certs/ca-certificates.crt }
              match_typed_subject_alt_names:
                - san_type: DNS
                  matcher: { exact: "br-example-123456-unitycatalog.compute.eu-central-1.aws.neon.tech" }

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }
