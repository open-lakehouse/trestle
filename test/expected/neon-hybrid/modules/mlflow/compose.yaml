# MLflow tracking server, with its built-in AI Gateway
services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.18.0-full
    restart: unless-stopped
    entrypoint:
      - "sh"
      - "-c"
      - 'if [ -z "$$MLFLOW_CRYPTO_KEK_PASSPHRASE" ]; then echo "mlflow: MLFLOW_CRYPTO_KEK_PASSPHRASE is not set; set it before starting the stack (see README.md)" >&2; exit 64; fi; exec "$$@"'
      - "mlflow"
    command:
      - "mlflow"
      - "server"
      - "--serve-artifacts"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "5000"
      - "--static-prefix"
      - "/mlflow"
      # One model registry per environment: MLflow's registry API and UI read and write the
      # models of Unity Catalog, which runs as a function and is called at its URL.
      - "--registry-store-uri"
      - "uc:https://br-example-123456-unitycatalog.compute.eu-central-1.aws.neon.tech"
    env_file:
      - path: ./modules/mlflow/.env/mlflow.env
        format: raw
    environment:
      # The Host headers MLflow accepts: browsers on localhost, or on any `*.localhost` name
      # (an instance's own host label, which keeps its cookies apart from another
      # instance's, or the gateway's name under auth), in-network callers through the
      # gateway, and the gateway-init job calling it directly. A `.localhost` name only ever
      # resolves to the loopback address (RFC 6761), so it can't be rebound to another host.
      # Seals the provider keys the AI Gateway stores. Passed through from the process that
      # starts the stack, never written here; see the README's key passphrase step. Unset,
      # the entrypoint refuses to start (MLflow would fall back to a public default).
      MLFLOW_CRYPTO_KEK_PASSPHRASE:
      MLFLOW_SERVER_ALLOWED_HOSTS: "localhost,localhost:*,*.localhost,*.localhost:*,127.0.0.1,127.0.0.1:*,envoy:10000,mlflow:5000"
      # Makes the mounted package visible: its entry point registers MLflow's OSS Unity Catalog
      # store for the `uc:` scheme, which the server otherwise doesn't accept.
      PYTHONPATH: /opt/trestle/mlflow-plugins
      # Registering a model version copies its files into UC's storage; the UC store downloads
      # them first through this tracking URI, i.e. from the server itself.
      MLFLOW_TRACKING_URI: http://127.0.0.1:5000/mlflow
    configs:
      - source: mlflow_uc_registry_module
        target: /opt/trestle/mlflow-plugins/trestle_mlflow_uc_registry.py
      - source: mlflow_uc_registry_metadata
        target: /opt/trestle/mlflow-plugins/trestle_mlflow_uc_registry-0.0.0.dist-info/METADATA
      - source: mlflow_uc_registry_entry_points
        target: /opt/trestle/mlflow-plugins/trestle_mlflow_uc_registry-0.0.0.dist-info/entry_points.txt
    expose:
      - "5000"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/mlflow/health')\""
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Seeds the AI Gateway with one endpoint per configured model, routed to the upstream with the
  # credentials passed in here. Idempotent: re-runs on every `up`, re-points only the endpoints
  # it made when the upstream changes, and leaves the rest alone.
  mlflow-gateway-init:
    image: ghcr.io/mlflow/mlflow:v3.18.0-full
    init: true
    restart: "no"
    command: ["python", "/seed_gateway.py"]
    environment:
      MLFLOW_URL: http://mlflow:5000/mlflow
      MLFLOW_GATEWAY_MODELS: "anthropic:claude-opus-5-5,anthropic:claude-sonnet-5-5,anthropic:claude-haiku-5-5"
      MLFLOW_UPSTREAM: keys
      # Credentials, passed through from the process that starts the stack (a bare name takes
      # the caller's value, or stays unset): never written into the rendered stack.
      ANTHROPIC_API_KEY:
      OPENAI_API_KEY:
      GEMINI_API_KEY:
      DATABRICKS_HOST:
      DATABRICKS_TOKEN:
    configs:
      - source: mlflow_seed_gateway
        target: /seed_gateway.py
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/seeded"]
      interval: 2s
      timeout: 3s
      retries: 30
