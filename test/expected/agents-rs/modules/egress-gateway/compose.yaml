# Egress gateway: the Envoy the environment's services reach outside upstreams through, which
# adds each route's credential itself, and the secret server that hands it those credentials
# over SDS. Neither publishes a port or joins the mesh: they are reached on the environment's
# own network only.
services:
  egress-gateway:
    image: envoyproxy/envoy:v1.40.2
    restart: unless-stopped
    configs:
      - source: egress_envoy_config
        target: /etc/envoy/envoy.yaml
    command: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "warn"]
    volumes:
      # Only this container and the secret server mount it: the mount is the caller's identity.
      - sds-egress-gateway:/run/trestle-sds
    healthcheck:
      # Envoy's admin `/ready` answers 200 once every listener and cluster has initialized. Admin
      # binds the container's loopback, so the probe runs in the container (bash, no curl).
      test:
        - "CMD"
        - "bash"
        - "-c"
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9901
          && printf 'GET /ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          && head -n1 <&3 | grep -q ' 200 '
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    depends_on:
      secret-server:
        condition: service_started

  secret-server:
    image: ghcr.io/open-lakehouse/trestle-secret-server:0.0.4
    restart: unless-stopped
    configs:
      - source: secret_server_config
        target: /etc/trestle/secret-server.yaml
    # The routes' credentials and the secrets modules read over SDS, by name only: the launcher
    # supplies the values. No other service in the environment lists them.
    environment:
      TRESTLE_KEYRING_UNITY_CATALOG_RS__SERVER_KEK:
    volumes:
      - sds-egress-gateway:/run/trestle-sds/egress-gateway
      - sds-unity-catalog-rs:/run/trestle-sds/unity-catalog-rs

volumes:
  sds-egress-gateway:
  sds-unity-catalog-rs:
