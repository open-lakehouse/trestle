version = 5

# The agents scenario on mangrove's Rust Unity Catalog server, with its tools served to agents
# over MCP (`uc-mcp`): at the gateway at `/uc-mcp/mcp`, and in-network (for the in-stack agent
# host) at `http://uc-mcp:8090/uc-mcp/mcp`.

[selection]
modules = ["postgres", "rustfs", "unity-catalog-rs", "mlflow", "omnigent", "uc-mcp"]

[context]
env_name = "agents-rs"
