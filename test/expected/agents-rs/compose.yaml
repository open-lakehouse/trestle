# Top-level compose entrypoint. Every backing service is pulled in via `include:`.
# The file list is owned by the planner, not edited by hand.
name: agents-rs

configs:
  egress_envoy_config:
    file: ./modules/egress-gateway/envoy.yaml
  envoy_config:
    file: ./modules/envoy/envoy.yaml
  gateway_certs_script:
    file: ./modules/envoy/certs.sh
  mlflow_seed_gateway:
    file: ./modules/mlflow/seed_gateway.py
  mlflow_uc_registry_entry_points:
    file: ./modules/mlflow/uc-registry/entry_points.txt
  mlflow_uc_registry_metadata:
    file: ./modules/mlflow/uc-registry/METADATA
  mlflow_uc_registry_module:
    file: ./modules/mlflow/uc-registry/trestle_mlflow_uc_registry.py
  omnigent_databricks_config:
    file: ./modules/omnigent/databricks/config.yaml
  omnigent_databricks_token:
    file: ./modules/omnigent/databricks/databricks_token.py
  postgres_init:
    file: ./modules/postgres/init-databases.sh
  rustfs_sts_shim:
    file: ./modules/rustfs/sts_shim.py
  secret_server_config:
    file: ./modules/egress-gateway/secret-server.yaml
  unity_catalog_rs_config:
    file: ./modules/unity-catalog-rs/config.yaml

secrets:
  postgres_password:
    file: ./modules/postgres/secrets/postgres_password

include:
  - path: ./modules/egress-gateway/compose.yaml
    project_directory: .
  - path: ./modules/envoy/compose.yaml
    project_directory: .
  - path: ./modules/postgres/compose.yaml
    project_directory: .
  - path:
      - ./modules/unity-catalog-rs/compose.yaml
      - ./modules/egress-gateway/consumers/unity-catalog-rs.yaml
    project_directory: .
  - path: ./modules/uc-mcp/compose.yaml
    project_directory: .
  - path: ./modules/omnigent/compose.yaml
    project_directory: .
  - path: ./modules/rustfs/compose.yaml
    project_directory: .
  - path: ./modules/mlflow/compose.yaml
    project_directory: .
