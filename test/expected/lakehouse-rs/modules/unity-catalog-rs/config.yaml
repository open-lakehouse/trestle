# In a container it also says where it listens and where its database is (a Neon Function
# gets both from the branch). The database URL is read from `DATABASE_URL`.
host: 0.0.0.0
port: 8080
backend:
  engine: postgres
  url: { env: DATABASE_URL }

# What mangrove's Unity Catalog server runs with wherever it runs: this file in a container,
# or `UC_SERVER_CONFIG_YAML` for a Neon Function, each followed by its placement's
# `encryption` block. API-only, and anonymous until the services verify callers' tokens.
ui: { serve: false }
auth: { mode: anonymous }

# In a container: the secret server's key service wraps and unwraps the data keys, under the
# keyring it alone holds (`trestle key`). The server never sees a key-encryption key, only the
# socket (`TRESTLE_SDS_SOCKET`) and the key's name (`TRESTLE_KEY_SERVER_KEK`). Values sealed
# under an imported `UC_SERVER_KEK` open through its alias, `kek-1`.
encryption:
  provider:
    key_service:
      socket: { env: TRESTLE_SDS_SOCKET }
      key: { env: TRESTLE_KEY_SERVER_KEK }
