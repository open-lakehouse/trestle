version = 3

# The lakehouse scenario with its Postgres and object store hosted in a cloud (AWS RDS and
# S3) — the `hosted-postgres` and `aws-s3` providers in place of the in-stack `postgres` and
# `rustfs`. Secrets are `${VAR}` references, resolved at render time
# from the environment or `secrets.env` beside this file.

[selection]
modules = ["hosted-postgres", "aws-s3", "unity-catalog", "mlflow"]
capabilities = []
extra_resources = []

[selection.hosted.hosted-postgres]
cloud = "aws"

[selection.hosted.hosted-postgres.connection]
kind = "postgres"
host = "lakehouse.abc123example.us-east-1.rds.amazonaws.com"
port = 5432
username = "lakehouse"
password = "${PG_PASSWORD}"

[selection.hosted.aws-s3]
cloud = "aws"

[selection.hosted.aws-s3.connection]
kind = "s3"
region = "us-east-1"
access_key_id = "${AWS_ACCESS_KEY_ID}"
secret_access_key = "${AWS_SECRET_ACCESS_KEY}"
role_arn = "arn:aws:iam::123456789012:role/lakehouse-uc"

[selection.gateway]
auth = false
policy = false

[context]
env_name = "hybrid"
gateway_service = "envoy"
gateway_internal_port = 10000
gateway_host_port = 9080
gateway_admin_port = 9901
dedicated_listener_ports = []
dedicated_listener_port_base = 9100
data_root = "./.data"

[context.provider_preference]
