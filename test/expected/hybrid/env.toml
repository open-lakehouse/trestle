version = 1

# The lakehouse scenario with its Postgres and object store provided by a cloud (AWS RDS and
# S3) instead of running in compose. Secrets are `${VAR}` references, resolved at render time
# from the environment or `secrets.env` beside this file.

[selection]
modules = ["envoy", "postgres", "rustfs", "unity-catalog", "mlflow"]
capabilities = []
extra_resources = []

[selection.external.postgres]
cloud = "aws"

[selection.external.postgres.connection]
kind = "relational_db"
host = "lakehouse.abc123example.us-east-1.rds.amazonaws.com"
port = 5432
username = "lakehouse"
password = "${PG_PASSWORD}"

[selection.external.rustfs]
cloud = "aws"

[selection.external.rustfs.connection]
kind = "object_store"
endpoint = "https://s3.us-east-1.amazonaws.com"

[selection.external.rustfs.connection.credential]
flavour = "s3"
access_key_id = "${AWS_ACCESS_KEY_ID}"
secret_access_key = "${AWS_SECRET_ACCESS_KEY}"
region = "us-east-1"
role_arn = "arn:aws:iam::123456789012:role/lakehouse-uc"

[context]
env_name = "hybrid"
gateway_service = "envoy"
gateway_internal_port = 10000
gateway_host_port = 9080
gateway_admin_port = 9901
dedicated_listener_ports = []
dedicated_listener_port_base = 9100
data_root = "./.data"

[context.provider_preference]
