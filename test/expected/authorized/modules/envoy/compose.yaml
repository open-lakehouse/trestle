# Envoy gateway
services:
  envoy:
    image: envoyproxy/envoy:v1.38-latest
    restart: unless-stopped
    configs:
      - source: envoy_config
        target: /etc/envoy/envoy.yaml
    command: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "warn"]
    depends_on:
      authelia:
        condition: service_healthy
      gateway-certs:
        condition: service_completed_successfully
    ports:
      - "9080:10000"
      - "9100:9100"
      - "9901:9901"
    volumes:
      - gateway-certs:/certs:ro
    networks:
      default:
        # In-network clients resolve these hostnames to the gateway: emulated public hosts,
        # whose TLS it terminates with a local CA, and under forward-auth the dotted alias
        # in-network callers address the shared listener by. Compose DNS has no wildcards:
        # each host is listed.
        aliases:
          - authorized.internal
          - mlflow.s3.amazonaws.com
          - mlflow.s3.us-east-1.amazonaws.com
          - s3.amazonaws.com
          - s3.us-east-1.amazonaws.com
          - sts.amazonaws.com
          - sts.us-east-1.amazonaws.com
          - unity.s3.amazonaws.com
          - unity.s3.us-east-1.amazonaws.com

  # One-shot: mints the local CA and the gateway's certificate for its TLS hostnames.
  gateway-certs:
    image: eclipse-temurin:17-jdk-noble
    entrypoint: ["bash", "/certs.sh"]
    environment:
      CERT_DIR: /certs
      CERT_HOSTS: "authorized.localhost mlflow.s3.amazonaws.com mlflow.s3.us-east-1.amazonaws.com s3.amazonaws.com s3.us-east-1.amazonaws.com sts.amazonaws.com sts.us-east-1.amazonaws.com unity.s3.amazonaws.com unity.s3.us-east-1.amazonaws.com"
    configs:
      - source: gateway_certs_script
        target: /certs.sh
    volumes:
      - gateway-certs:/certs

volumes:
  gateway-certs:
