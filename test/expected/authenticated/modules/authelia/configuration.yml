# Authelia configuration — rendered by the `authelia` module. A minimal, self-contained
# showcase setup: file-based users, local SQLite storage, single-factor (password) auth.
# Authelia's authz endpoints return the authenticated identity as Remote-User / Remote-Email /
# Remote-Name / Remote-Groups headers, which Envoy injects onto the upstream request (see the
# gateway's ext_authz filter). Not hardened for production.

theme: light

server:
  # Bind on 9091 (the port Envoy's `authelia` cluster targets) and serve the whole surface —
  # login portal, API, and the ext_authz endpoint — under the `/authelia` path. The gateway
  # routes `/authelia` here (ext_authz disabled on that route) so a logged-out browser can reach
  # the login page, and posts authorization checks to `/authelia/api/authz/ext-authz/`. Path-
  # based (rather than the docs' subdomain) keeps the showcase on a single gateway origin.
  address: tcp://:9091/authelia

log:
  level: info

# Password (single-factor) auth against the mounted users file. The browser is redirected here
# to log in; API clients pass an `Authorization` / `Proxy-Authorization` header instead.
authentication_backend:
  file:
    path: /config/users.yml

# One factor (a valid session cookie or Authorization header) is enough for every route Envoy
# forwards here. The gateway only sends API/UI routes to ext_authz; resource backends are never
# gated, so a coarse default policy is the whole access-control surface for the showcase.
access_control:
  default_policy: one_factor

session:
  name: authelia_session
  # Authelia only authorizes requests for a configured cookie domain, which must be dotted and
  # served over HTTPS, so the gateway has two names under auth:
  cookies:
    # Browsers and host-side clients: the gateway's `*.localhost` origin over TLS, and the
    # portal route Authelia redirects logged-out browsers to. (Cookies are scoped by host, not
    # port, so the domain is just the host.) Re-render after changing the gateway port; edit
    # both for a real hostname.
    - domain: authenticated.localhost
      authelia_url: https://authenticated.localhost:9080/authelia
    # In-network API callers, who reach the gateway over plain HTTP at its dotted network alias
    # (the gateway reports them as `https`). They send credentials, so no browser ever follows
    # this portal URL; it only needs to be a valid one.
    - domain: authenticated.internal
      authelia_url: https://authenticated.internal/authelia

# Local, on-disk storage (no external database) — persisted via the `/data` volume mount.
storage:
  local:
    path: /data/db.sqlite3

# No mailer: a local showcase doesn't send password-reset / 2FA mail. The filesystem notifier
# writes any such message to a file under the data volume instead of mailing it.
notifier:
  filesystem:
    filename: /data/notification.txt
