# Envoy front-edge config, rendered from the planner's gateway config.
# Route ordering matters: more-specific prefixes come before less-specific ones,
# and the default app route (if any) is emitted last.

static_resources:
  listeners:
    - name: gateway
      address:
        socket_address: { address: 0.0.0.0, port_value: 10000 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: AUTO
                stat_prefix: ingress_http
                use_remote_address: true
                upgrade_configs:
                  - upgrade_type: websocket
                route_config:
                  name: gateway_route
                  virtual_hosts:
                    - name: all
                      domains: ["*"]
                      # Anti-spoofing: strip any client-supplied identity headers on ingress so
                      # they can only ever come from the auth provider. The ext_authz filter
                      # below re-adds them from the authorization response, so the upstream's
                      # Remote-* values are always auth-asserted, never forged by a caller.
                      request_headers_to_remove:
                        - "Remote-User"
                        - "Remote-Email"
                        - "Remote-Name"
                        - "Remote-Groups"
                      routes:
                        # The auth provider's own login portal: routed to its cluster with
                        # ext_authz DISABLED on this route, so the deny-redirect a logged-out
                        # browser follows can actually reach the login page (gating it would loop).
                        - match: { prefix: "/authelia" }
                          route:
                            cluster: authelia
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true
                        - match: { prefix: "/api/2.1/unity-catalog" }
                          route:
                            cluster: unitycatalog
                        - match: { prefix: "/api/2.0/mlflow" }
                          route:
                            cluster: mlflow
                            regex_rewrite:
                              pattern:
                                google_re2: {}
                                regex: "^/api/2.0/mlflow(.*)$"
                              substitution: "/mlflow/api/2.0/mlflow\\1"
                        - match: { prefix: "/unity-catalog" }
                          route:
                            cluster: unitycatalog
                        - match: { prefix: "/api/2.0/otel" }
                          route:
                            cluster: mlflow
                        - match: { prefix: "/mlflow" }
                          route:
                            cluster: mlflow
                http_filters:
                  # Forward-auth: every request on this (shared) listener is checked with the
                  # auth provider first. Both browser sessions (cookie) and API clients
                  # (Authorization / Proxy-Authorization header) are supported — the provider
                  # decides which applies. On allow it returns the trusted Remote-* identity
                  # headers, which are forwarded upstream; on deny it returns a redirect
                  # (browser → login) or 401 (API).
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      transport_api_version: V3
                      http_service:
                        server_uri:
                          uri: authelia:9091
                          cluster: authelia
                          timeout: 0.25s
                        path_prefix: "/authelia/api/authz/ext-authz/"
                        authorization_request:
                          allowed_headers:
                            patterns:
                              - exact: authorization
                              - exact: proxy-authorization
                              - exact: cookie
                              - exact: accept
                          headers_to_add:
                            - { key: X-Forwarded-Proto, value: "%REQ(:SCHEME)%" }
                            - { key: X-Forwarded-Host, value: "%REQ(:AUTHORITY)%" }
                        authorization_response:
                          allowed_upstream_headers:
                            patterns:
                              - exact: "Remote-User"
                              - exact: "Remote-Email"
                              - exact: "Remote-Name"
                              - exact: "Remote-Groups"
                          allowed_client_headers:
                            patterns:
                              - exact: set-cookie
                              - exact: location
                      failure_mode_allow: false
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
    - name: dedicated_9100
      address:
        socket_address: { address: 0.0.0.0, port_value: 9100 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: AUTO
                stat_prefix: ingress_http
                use_remote_address: true
                upgrade_configs:
                  - upgrade_type: websocket
                route_config:
                  name: dedicated_9100_route
                  virtual_hosts:
                    - name: all
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route:
                            cluster: seaweedfs
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: authelia
      type: STRICT_DNS
      connect_timeout: 2s
      load_assignment:
        cluster_name: authelia
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: authelia
                      port_value: 9091
    - name: mlflow
      type: STRICT_DNS
      connect_timeout: 2s
      load_assignment:
        cluster_name: mlflow
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: mlflow
                      port_value: 5000
    - name: seaweedfs
      type: STRICT_DNS
      connect_timeout: 2s
      load_assignment:
        cluster_name: seaweedfs
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: seaweedfs
                      port_value: 8333
    - name: unitycatalog
      type: STRICT_DNS
      connect_timeout: 2s
      load_assignment:
        cluster_name: unitycatalog
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: unitycatalog
                      port_value: 8080

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }