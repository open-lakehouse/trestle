# Envoy front-edge config, rendered from the planner's gateway config.
# Route ordering matters: more-specific prefixes come before less-specific ones,
# and the default app route (if any) is emitted last.

static_resources:
  listeners:
    - name: gateway
      address:
        socket_address: { address: 0.0.0.0, port_value: 10000 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: AUTO
                stat_prefix: ingress_http
                use_remote_address: true
                upgrade_configs:
                  - upgrade_type: websocket
                route_config:
                  name: gateway_route
                  virtual_hosts:
                    - name: all
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/api/2.1/unity-catalog" }
                          route:
                            cluster: unitycatalog
                        - match: { prefix: "/api/2.0/mlflow" }
                          route:
                            cluster: mlflow
                            regex_rewrite:
                              pattern:
                                google_re2: {}
                                regex: "^/api/2.0/mlflow(.*)$"
                              substitution: "/mlflow/api/2.0/mlflow\\1"
                        - match: { prefix: "/api/v1/lineage" }
                          route:
                            cluster: headwaters
                            regex_rewrite:
                              pattern:
                                google_re2: {}
                                regex: "^/api/v1/lineage(.*)$"
                              substitution: "/lineage/api/v1/lineage\\1"
                        - match: { prefix: "/unity-catalog" }
                          route:
                            cluster: unitycatalog
                        - match: { prefix: "/api/2.0/otel" }
                          route:
                            cluster: mlflow
                        - match: { prefix: "/lineage" }
                          route:
                            cluster: headwaters
                        - match: { prefix: "/jaeger" }
                          route:
                            cluster: jaeger
                        - match: { prefix: "/mlflow" }
                          route:
                            cluster: mlflow
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
    - name: dedicated_9100
      address:
        socket_address: { address: 0.0.0.0, port_value: 9100 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: AUTO
                stat_prefix: ingress_http
                use_remote_address: true
                upgrade_configs:
                  - upgrade_type: websocket
                route_config:
                  name: dedicated_9100_route
                  virtual_hosts:
                    - name: all
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route:
                            cluster: azurite
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: azurite
      type: STRICT_DNS
      connect_timeout: 2s
      load_assignment:
        cluster_name: azurite
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: azurite
                      port_value: 10000
    - name: headwaters
      type: STRICT_DNS
      connect_timeout: 2s
      load_assignment:
        cluster_name: headwaters
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: headwaters
                      port_value: 8091
    - name: jaeger
      type: STRICT_DNS
      connect_timeout: 2s
      load_assignment:
        cluster_name: jaeger
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: jaeger
                      port_value: 16686
    - name: mlflow
      type: STRICT_DNS
      connect_timeout: 2s
      load_assignment:
        cluster_name: mlflow
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: mlflow
                      port_value: 5000
    - name: unitycatalog
      type: STRICT_DNS
      connect_timeout: 2s
      load_assignment:
        cluster_name: unitycatalog
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: unitycatalog
                      port_value: 8080

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }