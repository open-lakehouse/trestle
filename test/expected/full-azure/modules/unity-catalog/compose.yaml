# Unity Catalog
services:
  unitycatalog:
    image: unitycatalog/unitycatalog:main-2f2e32d
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      azurite-init:
        condition: service_completed_successfully
    env_file:
      - path: ./modules/unity-catalog/.env/unitycatalog.env
        format: raw
    expose:
      - "8080"
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/api/2.1/unity-catalog/catalogs || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s