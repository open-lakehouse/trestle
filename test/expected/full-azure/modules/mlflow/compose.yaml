# MLflow tracking server
services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.10.1-full
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      azurite-init:
        condition: service_completed_successfully
    command:
      - "mlflow"
      - "server"
      - "--backend-store-uri"
      - "postgresql://<redacted>@db:5432/mlflow"
      - "--artifacts-destination"
      - "wasbs://mlflow@devstoreaccount1.blob.core.windows.net"
      - "--serve-artifacts"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "5000"
      - "--static-prefix"
      - "/mlflow"
    environment:
      AZURE_STORAGE_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=<redacted>;BlobEndpoint=http://envoy:9100/devstoreaccount1;
    expose:
      - "5000"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/mlflow/health')\""
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s