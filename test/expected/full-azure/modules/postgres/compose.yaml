# Postgres — contributed by the `postgres` module.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - path: ./modules/postgres/.env/db.env
        format: raw
    secrets:
      - postgres_password
    expose:
      - "5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    configs:
      - source: postgres_init
        target: /docker-entrypoint-initdb.d/init-databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
