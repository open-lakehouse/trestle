# Release placeholder for the npm package `@open-lakehouse/stack-wasm` (this
# directory). release-plz only understands Cargo packages, so this manifest
# `include`s exactly the files that end up in the npm tarball; a change to any
# of them releases the package. Its `version` is the npm version: release-plz
# bumps it from conventional commits, writes CHANGELOG.md and tags
# `stack-wasm-v<version>`, and release-plz.yml then publishes the npm package (see
# .github/workflows/publish-npm.yml). Never published to crates.io.

[package]
name = "stack-wasm"
version = "0.0.3"
description = "Release placeholder for the @open-lakehouse/stack-wasm npm package"
publish = false
readme = "README.md"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
autobins = false
autoexamples = false
autotests = false
autobenches = false
# Anchored (leading `/`): unanchored names would also match inside node_modules.
include = [
  "/Cargo.toml",
  "/release.rs",
  "/package.json",
  "/README.md",
  "/tsconfig*.json",
  "/src/**",
  "!**/*.test.ts",
  "!**/*.test.tsx",
  "!/src/index.ts",
  "!/src/pkg.d.ts",
  "!**/*.typecheck.ts",
]

[lib]
path = "release.rs"
